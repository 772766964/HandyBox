<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>dice</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HandyBox" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --primary: #38bdf8;
      --primary-2: #0284c7;
      --danger: #fb7185;
      --success: #4ade80;
      --warning: #facc15;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.16), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    }

    body {
      padding: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
      color: var(--text);
      border-radius: 14px;
      background: var(--panel-2);
      transition:
        transform 0.12s ease,
        background 0.12s ease,
        opacity 0.12s ease,
        border-color 0.12s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      padding: 9px 12px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: rgba(56, 189, 248, 0.9);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
    }

    .topbar {
      max-width: 1240px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
    }

    .mode-pill {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(12px);
    }

    .app {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-areas:
        "result"
        "controls"
        "history";
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(17, 24, 39, 0.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .panel-subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .panel-body {
      padding: 14px;
    }

    .controls-panel {
      grid-area: controls;
    }

    .result-panel {
      grid-area: result;
    }

    .history-panel {
      grid-area: history;
    }

    .form-section {
      margin-bottom: 16px;
    }

    .form-section:last-child {
      margin-bottom: 0;
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stepper {
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      gap: 8px;
      align-items: center;
    }

    .stepper button {
      height: 42px;
      font-size: 22px;
      font-weight: 800;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .quick-grid button,
    .preset-grid button {
      min-height: 42px;
      padding: 8px 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 700;
    }

    .quick-grid button.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .preset-grid button {
      text-align: left;
      font-size: 13px;
      line-height: 1.25;
    }

    .preset-grid small {
      display: block;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .switch-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.55);
    }

    .switch-line label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .switch-line input[type="checkbox"] {
      width: 20px;
      min-height: 20px;
      accent-color: var(--primary);
    }

    .expression-card {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .expression-card strong {
      font-size: 18px;
    }

    .expression-card span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .dice-stage {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .dice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
      gap: 10px;
      align-items: center;
    }

    .dice-grid.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 128px;
      color: var(--muted);
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: 18px;
    }

    .die-card {
      position: relative;
      min-height: 86px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)),
        rgba(31, 41, 55, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .die-card.kept {
      border-color: rgba(74, 222, 128, 0.75);
      box-shadow:
        0 0 0 3px rgba(74, 222, 128, 0.08),
        inset 0 1px rgba(255, 255, 255, 0.16);
    }

    .die-card.discarded {
      opacity: 0.42;
      filter: grayscale(0.65);
    }

    .die-card.rolling {
      animation: wobble 0.18s linear infinite;
    }

    @keyframes wobble {
      0% {
        transform: rotate(-2deg) translateY(0);
      }

      50% {
        transform: rotate(2deg) translateY(-2px);
      }

      100% {
        transform: rotate(-2deg) translateY(0);
      }
    }

    .die-value {
      font-size: clamp(28px, 8vw, 52px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .die-face {
      font-size: clamp(42px, 12vw, 68px);
      line-height: 0.9;
      font-family:
        "Apple Color Emoji",
        "Segoe UI Symbol",
        "Noto Emoji",
        sans-serif;
    }

    .die-label {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .keep-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 6px;
      border-radius: 999px;
      font-size: 10px;
      background: rgba(74, 222, 128, 0.18);
      color: var(--success);
      border: 1px solid rgba(74, 222, 128, 0.35);
    }

    .total-card {
      border-radius: 20px;
      padding: 14px;
      background:
        linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(168, 85, 247, 0.14)),
        rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
    }

    .total-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .total-card strong {
      display: block;
      font-size: clamp(42px, 14vw, 88px);
      line-height: 1;
      letter-spacing: -0.07em;
    }

    .detail-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
      text-align: center;
      min-height: 20px;
    }

    .primary-btn {
      width: 100%;
      min-height: 56px;
      font-size: 19px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      box-shadow: 0 14px 32px rgba(2, 132, 199, 0.35);
    }

    .secondary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .secondary-actions button {
      min-height: 42px;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 430px;
      overflow: auto;
      padding-right: 2px;
    }

    .history-empty {
      color: var(--muted);
      text-align: center;
      padding: 26px 10px;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      font-size: 14px;
    }

    .history-item {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.52);
    }

    .history-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .history-expr {
      font-weight: 800;
      font-size: 14px;
    }

    .history-time {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .history-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 9px;
      word-break: break-word;
    }

    .history-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .history-actions button {
      min-height: 34px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .danger-btn {
      color: #fecdd3 !important;
      background: rgba(251, 113, 133, 0.14);
    }

    .clear-btn {
      min-height: 34px;
      padding: 6px 10px;
      color: #fecdd3;
      background: rgba(251, 113, 133, 0.14);
      border: 1px solid rgba(251, 113, 133, 0.25);
      font-size: 12px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 8px;
    }

    @media (orientation: landscape) and (min-width: 760px) {
      body {
        padding: 12px;
      }

      .topbar {
        margin-bottom: 10px;
      }

      .app {
        height: calc(100vh - 86px);
        max-width: none;
        grid-template-columns: 300px minmax(360px, 1fr) 330px;
        grid-template-areas: "controls result history";
      }

      .panel {
        min-height: 0;
      }

      .panel-body {
        height: calc(100% - 53px);
        overflow: auto;
      }

      .result-panel .panel-body {
        display: flex;
        flex-direction: column;
      }

      .dice-stage {
        flex: 1;
        min-height: 0;
      }

      .history-list {
        max-height: none;
      }

      .quick-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .preset-grid {
        grid-template-columns: 1fr;
      }

      .dice-grid {
        grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .mode-pill {
        width: 100%;
        text-align: center;
      }

      .quick-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .preset-grid {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .dice-grid {
        grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <h1>dice</h1>
      <span>动态 / 静态骰子工具</span>
    </div>
    <div class="mode-pill" id="modePill">动态模式已开启</div>
  </header>

  <main class="app">
    <!-- 配置区 -->
    <section class="panel controls-panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">配置</div>
          <div class="panel-subtitle">选择骰子数量、面数和桌游规则</div>
        </div>
      </div>

      <div class="panel-body">
        <div class="form-section">
          <div class="section-label">
            <span>骰子数量</span>
            <span>1 - 100</span>
          </div>
          <div class="stepper">
            <button id="countMinus" type="button">−</button>
            <input id="countInput" type="number" min="1" max="100" value="1" inputmode="numeric" />
            <button id="countPlus" type="button">+</button>
          </div>
        </div>

        <div class="form-section">
          <div class="section-label">
            <span>骰子类型</span>
            <span>快捷选择</span>
          </div>
          <div class="quick-grid" id="quickSides">
            <button type="button" data-sides="4">D4</button>
            <button type="button" data-sides="6">D6</button>
            <button type="button" data-sides="8">D8</button>
            <button type="button" data-sides="10">D10</button>
            <button type="button" data-sides="12">D12</button>
            <button type="button" data-sides="20">D20</button>
            <button type="button" data-sides="100">D100</button>
            <button type="button" id="customSideButton">自定义</button>
          </div>
        </div>

        <div class="form-section">
          <div class="section-label">
            <span>自定义面数</span>
            <span>D2 - D10000</span>
          </div>
          <input id="sidesInput" type="number" min="2" max="10000" value="6" inputmode="numeric" />
        </div>

        <div class="form-section">
          <div class="row">
            <div>
              <div class="section-label">
                <span>修正值</span>
                <span>可正可负</span>
              </div>
              <input id="modifierInput" type="number" value="0" inputmode="numeric" />
            </div>

            <div>
              <div class="section-label">
                <span>动画时长</span>
                <span>动态模式</span>
              </div>
              <select id="durationSelect">
                <option value="350">短，0.35 秒</option>
                <option value="650" selected>标准，0.65 秒</option>
                <option value="1000">长，1 秒</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="row">
            <div>
              <div class="section-label">
                <span>规则</span>
                <span>桌游常用</span>
              </div>
              <select id="ruleSelect">
                <option value="sum">求和</option>
                <option value="kh">取最高</option>
                <option value="kl">取最低</option>
              </select>
            </div>

            <div>
              <div class="section-label">
                <span>保留数量</span>
                <span>kh / kl</span>
              </div>
              <input id="keepInput" type="number" min="1" max="100" value="1" inputmode="numeric" />
            </div>
          </div>
          <div class="hint" id="ruleHint">默认规则：所有骰子求和。</div>
        </div>

        <div class="form-section">
          <div class="switch-line">
            <label for="animationToggle">
              <input id="animationToggle" type="checkbox" checked />
              动态转动显示结果
            </label>
            <span class="panel-subtitle">关闭后为静态直接显示</span>
          </div>
        </div>

        <div class="form-section">
          <div class="section-label">
            <span>桌游预设</span>
            <span>一键设置</span>
          </div>
          <div class="preset-grid" id="presetGrid">
            <button type="button" data-preset="1d6">
              1D6
              <small>常规六面骰</small>
            </button>
            <button type="button" data-preset="2d6">
              2D6
              <small>桌游常用</small>
            </button>
            <button type="button" data-preset="3d6">
              3D6
              <small>属性 / 检定</small>
            </button>
            <button type="button" data-preset="d20">
              1D20
              <small>D&D 检定</small>
            </button>
            <button type="button" data-preset="d20plus5">
              1D20 + 5
              <small>带修正值</small>
            </button>
            <button type="button" data-preset="d100">
              1D100
              <small>COC 百分骰</small>
            </button>
            <button type="button" data-preset="advantage">
              优势
              <small>2D20 取最高</small>
            </button>
            <button type="button" data-preset="disadvantage">
              劣势
              <small>2D20 取最低</small>
            </button>
            <button type="button" data-preset="4d6kh3">
              4D6 取高 3
              <small>角色属性生成</small>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 结果区 -->
    <section class="panel result-panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">结果</div>
          <div class="panel-subtitle">动态滚动或静态平面展示</div>
        </div>
      </div>

      <div class="panel-body">
        <div class="expression-card">
          <strong id="expressionText">1D6</strong>
          <span id="resultModeText">动态模式</span>
        </div>

        <div class="dice-stage">
          <div id="diceGrid" class="dice-grid empty">点击“掷骰”开始</div>

          <div class="total-card">
            <span id="totalLabel">等待掷骰</span>
            <strong id="totalValue">—</strong>
          </div>

          <div class="detail-text" id="detailText"></div>

          <button id="rollButton" type="button" class="primary-btn">掷骰</button>

          <div class="secondary-actions">
            <button id="repeatButton" type="button">再掷一次</button>
            <button id="copyCurrentButton" type="button">复制当前结果</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 历史区 -->
    <section class="panel history-panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">历史结果</div>
          <div class="panel-subtitle">保存最近 100 条</div>
        </div>
        <button id="clearHistoryButton" type="button" class="clear-btn">清空</button>
      </div>

      <div class="panel-body">
        <div id="historyList" class="history-list"></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "dice.history.v1";
    const MAX_HISTORY = 100;

    const d6Faces = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    const state = {
      count: 1,
      sides: 6,
      modifier: 0,
      rule: "sum",
      keep: 1,
      animation: true,
      duration: 650
    };

    let history = loadHistory();
    let rolling = false;
    let lastOutcome = null;

    const els = {
      modePill: document.getElementById("modePill"),

      countMinus: document.getElementById("countMinus"),
      countPlus: document.getElementById("countPlus"),
      countInput: document.getElementById("countInput"),

      quickSides: document.getElementById("quickSides"),
      customSideButton: document.getElementById("customSideButton"),
      sidesInput: document.getElementById("sidesInput"),

      modifierInput: document.getElementById("modifierInput"),
      ruleSelect: document.getElementById("ruleSelect"),
      keepInput: document.getElementById("keepInput"),
      ruleHint: document.getElementById("ruleHint"),

      animationToggle: document.getElementById("animationToggle"),
      durationSelect: document.getElementById("durationSelect"),

      presetGrid: document.getElementById("presetGrid"),

      expressionText: document.getElementById("expressionText"),
      resultModeText: document.getElementById("resultModeText"),
      diceGrid: document.getElementById("diceGrid"),
      totalLabel: document.getElementById("totalLabel"),
      totalValue: document.getElementById("totalValue"),
      detailText: document.getElementById("detailText"),

      rollButton: document.getElementById("rollButton"),
      repeatButton: document.getElementById("repeatButton"),
      copyCurrentButton: document.getElementById("copyCurrentButton"),

      historyList: document.getElementById("historyList"),
      clearHistoryButton: document.getElementById("clearHistoryButton")
    };

    init();

    function init() {
      bindEvents();
      syncControlsFromState();
      renderHistory();
      renderInitialResult();
    }

    function bindEvents() {
      els.countMinus.addEventListener("click", () => {
        setCount(state.count - 1);
      });

      els.countPlus.addEventListener("click", () => {
        setCount(state.count + 1);
      });

      els.countInput.addEventListener("input", () => {
        setCount(toInt(els.countInput.value, 1));
      });

      els.quickSides.addEventListener("click", event => {
        const button = event.target.closest("button");
        if (!button) return;

        const sideValue = button.dataset.sides;
        if (sideValue) {
          setSides(toInt(sideValue, 6));
        }
      });

      els.customSideButton.addEventListener("click", () => {
        els.sidesInput.focus();
        els.sidesInput.select();
      });

      els.sidesInput.addEventListener("input", () => {
        setSides(toInt(els.sidesInput.value, 6));
      });

      els.modifierInput.addEventListener("input", () => {
        state.modifier = clamp(toInt(els.modifierInput.value, 0), -999999, 999999);
        updateExpression();
      });

      els.ruleSelect.addEventListener("change", () => {
        state.rule = els.ruleSelect.value;
        normalizeKeep();
        syncControlsFromState();
      });

      els.keepInput.addEventListener("input", () => {
        state.keep = clamp(toInt(els.keepInput.value, 1), 1, state.count);
        updateExpression();
      });

      els.animationToggle.addEventListener("change", () => {
        state.animation = els.animationToggle.checked;
        syncModeText();
      });

      els.durationSelect.addEventListener("change", () => {
        state.duration = toInt(els.durationSelect.value, 650);
      });

      els.presetGrid.addEventListener("click", event => {
        const button = event.target.closest("button[data-preset]");
        if (!button) return;
        applyPreset(button.dataset.preset);
      });

      els.rollButton.addEventListener("click", () => {
        rollDice();
      });

      els.repeatButton.addEventListener("click", () => {
        rollDice();
      });

      els.copyCurrentButton.addEventListener("click", () => {
        if (!lastOutcome) {
          toastButton(els.copyCurrentButton, "暂无结果");
          return;
        }
        copyText(formatOutcomeText(lastOutcome));
        toastButton(els.copyCurrentButton, "已复制");
      });

      els.clearHistoryButton.addEventListener("click", () => {
        if (!history.length) return;
        const ok = window.confirm("确定清空全部历史记录吗？");
        if (!ok) return;
        history = [];
        saveHistory();
        renderHistory();
      });
    }

    function setCount(value) {
      state.count = clamp(value, 1, 100);
      normalizeKeep();
      syncControlsFromState();
    }

    function setSides(value) {
      state.sides = clamp(value, 2, 10000);
      syncControlsFromState();
    }

    function normalizeKeep() {
      if (state.rule === "sum") {
        state.keep = 1;
      } else {
        state.keep = clamp(state.keep || 1, 1, state.count);
      }
    }

    function syncControlsFromState() {
      els.countInput.value = state.count;
      els.sidesInput.value = state.sides;
      els.modifierInput.value = state.modifier;
      els.ruleSelect.value = state.rule;
      els.keepInput.value = state.keep;
      els.keepInput.disabled = state.rule === "sum";
      els.animationToggle.checked = state.animation;
      els.durationSelect.value = String(state.duration);

      for (const button of els.quickSides.querySelectorAll("button[data-sides]")) {
        const isActive = Number(button.dataset.sides) === state.sides;
        button.classList.toggle("active", isActive);
      }

      if (state.rule === "sum") {
        els.ruleHint.textContent = "默认规则：所有骰子求和。";
      } else if (state.rule === "kh") {
        els.ruleHint.textContent = `当前规则：投 ${state.count} 个 D${state.sides}，保留最高 ${state.keep} 个。`;
      } else if (state.rule === "kl") {
        els.ruleHint.textContent = `当前规则：投 ${state.count} 个 D${state.sides}，保留最低 ${state.keep} 个。`;
      }

      syncModeText();
      updateExpression();
    }

    function syncModeText() {
      const text = state.animation ? "动态模式" : "静态模式";
      els.resultModeText.textContent = text;
      els.modePill.textContent = state.animation ? "动态模式已开启" : "静态直接展示";
    }

    function updateExpression() {
      els.expressionText.textContent = buildExpression(state);
    }

    function buildExpression(config) {
      let expr = `${config.count}D${config.sides}`;

      if (config.rule === "kh") {
        expr += `kh${config.keep}`;
      } else if (config.rule === "kl") {
        expr += `kl${config.keep}`;
      }

      if (config.modifier > 0) {
        expr += `+${config.modifier}`;
      } else if (config.modifier < 0) {
        expr += `${config.modifier}`;
      }

      return expr;
    }

    function applyPreset(name) {
      const presets = {
        "1d6": {
          count: 1,
          sides: 6,
          modifier: 0,
          rule: "sum",
          keep: 1
        },
        "2d6": {
          count: 2,
          sides: 6,
          modifier: 0,
          rule: "sum",
          keep: 1
        },
        "3d6": {
          count: 3,
          sides: 6,
          modifier: 0,
          rule: "sum",
          keep: 1
        },
        "d20": {
          count: 1,
          sides: 20,
          modifier: 0,
          rule: "sum",
          keep: 1
        },
        "d20plus5": {
          count: 1,
          sides: 20,
          modifier: 5,
          rule: "sum",
          keep: 1
        },
        "d100": {
          count: 1,
          sides: 100,
          modifier: 0,
          rule: "sum",
          keep: 1
        },
        "advantage": {
          count: 2,
          sides: 20,
          modifier: 0,
          rule: "kh",
          keep: 1
        },
        "disadvantage": {
          count: 2,
          sides: 20,
          modifier: 0,
          rule: "kl",
          keep: 1
        },
        "4d6kh3": {
          count: 4,
          sides: 6,
          modifier: 0,
          rule: "kh",
          keep: 3
        }
      };

      const preset = presets[name];
      if (!preset) return;

      Object.assign(state, preset);
      normalizeKeep();
      syncControlsFromState();
    }

    async function rollDice() {
      if (rolling) return;

      rolling = true;
      setRollingUI(true);

      const config = cloneConfig(state);
      const finalRolls = Array.from({length: config.count}, () => randomIntInclusive(1, config.sides));
      const finalOutcome = evaluateRolls(finalRolls, config);

      if (config.animation) {
        await playRollingAnimation(config);
      }

      renderOutcome(finalOutcome, true);
      lastOutcome = finalOutcome;
      addHistory(finalOutcome);

      rolling = false;
      setRollingUI(false);
    }

    function setRollingUI(isRolling) {
      els.rollButton.disabled = isRolling;
      els.repeatButton.disabled = isRolling;
      els.rollButton.textContent = isRolling ? "掷骰中..." : "掷骰";
    }

    function playRollingAnimation(config) {
      return new Promise(resolve => {
        const start = performance.now();

        function frame(now) {
          const elapsed = now - start;
          const tempRolls = Array.from({length: config.count}, () => randomIntInclusive(1, config.sides));
          const tempOutcome = {
            id: "rolling",
            time: new Date().toISOString(),
            config,
            expression: buildExpression(config),
            rolls: tempRolls,
            keptIndexes: new Set(tempRolls.map((_, index) => index)),
            discardedIndexes: new Set(),
            total: null,
            baseTotal: null,
            rolling: true
          };

          renderOutcome(tempOutcome, false);

          if (elapsed < config.duration) {
            requestAnimationFrame(frame);
          } else {
            resolve();
          }
        }

        requestAnimationFrame(frame);
      });
    }

    function evaluateRolls(rolls, config) {
      let keptIndexes = new Set();
      let discardedIndexes = new Set();

      if (config.rule === "sum") {
        keptIndexes = new Set(rolls.map((_, index) => index));
      } else {
        const keepCount = clamp(config.keep, 1, rolls.length);

        const sortedIndexes = rolls
          .map((value, index) => ({value, index}))
          .sort((a, b) => {
            if (config.rule === "kh") {
              return b.value - a.value || a.index - b.index;
            }
            return a.value - b.value || a.index - b.index;
          })
          .slice(0, keepCount)
          .map(item => item.index);

        keptIndexes = new Set(sortedIndexes);

        rolls.forEach((_, index) => {
          if (!keptIndexes.has(index)) {
            discardedIndexes.add(index);
          }
        });
      }

      const keptValues = rolls.filter((_, index) => keptIndexes.has(index));
      const baseTotal = keptValues.reduce((sum, value) => sum + value, 0);
      const total = baseTotal + config.modifier;

      return {
        id: cryptoId(),
        time: new Date().toISOString(),
        config: cloneConfig(config),
        expression: buildExpression(config),
        rolls,
        keptIndexes,
        discardedIndexes,
        baseTotal,
        total,
        rolling: false
      };
    }

    function renderInitialResult() {
      els.diceGrid.className = "dice-grid empty";
      els.diceGrid.textContent = "点击“掷骰”开始";
      els.totalLabel.textContent = "等待掷骰";
      els.totalValue.textContent = "—";
      els.detailText.textContent = "";
    }

    function renderOutcome(outcome, final) {
      const {config, rolls, keptIndexes, discardedIndexes} = outcome;

      els.diceGrid.className = "dice-grid";
      els.diceGrid.innerHTML = "";

      rolls.forEach((value, index) => {
        const card = document.createElement("div");
        card.className = "die-card";

        if (!final || outcome.rolling) {
          card.classList.add("rolling");
        }

        if (final && keptIndexes.has(index) && config.rule !== "sum") {
          card.classList.add("kept");
        }

        if (final && discardedIndexes.has(index)) {
          card.classList.add("discarded");
        }

        if (config.sides === 6 && value >= 1 && value <= 6) {
          const face = document.createElement("div");
          face.className = "die-face";
          face.textContent = d6Faces[value];

          const label = document.createElement("div");
          label.className = "die-label";
          label.textContent = `D6 = ${value}`;

          card.appendChild(face);
          card.appendChild(label);
        } else {
          const number = document.createElement("div");
          number.className = "die-value";
          number.textContent = value;

          const label = document.createElement("div");
          label.className = "die-label";
          label.textContent = `D${config.sides}`;

          card.appendChild(number);
          card.appendChild(label);
        }

        if (final && config.rule !== "sum" && keptIndexes.has(index)) {
          const badge = document.createElement("div");
          badge.className = "keep-badge";
          badge.textContent = "保留";
          card.appendChild(badge);
        }

        els.diceGrid.appendChild(card);
      });

      if (final) {
        els.totalLabel.textContent = "最终结果";
        els.totalValue.textContent = outcome.total;
        els.detailText.textContent = buildDetailText(outcome);
      } else {
        els.totalLabel.textContent = "掷骰中";
        els.totalValue.textContent = "…";
        els.detailText.textContent = `${outcome.expression} 正在滚动`;
      }
    }

    function buildDetailText(outcome) {
      const {config, rolls, keptIndexes, discardedIndexes, baseTotal, total} = outcome;

      const keptValues = rolls.filter((_, index) => keptIndexes.has(index));
      const discardedValues = rolls.filter((_, index) => discardedIndexes.has(index));

      let parts = [];

      parts.push(`${outcome.expression}`);

      if (config.rule === "kh") {
        parts.push(`保留最高 ${config.keep} 个：[${keptValues.join(", ")}]`);
      } else if (config.rule === "kl") {
        parts.push(`保留最低 ${config.keep} 个：[${keptValues.join(", ")}]`);
      }

      if (discardedValues.length) {
        parts.push(`舍弃：[${discardedValues.join(", ")}]`);
      }

      if (config.modifier !== 0) {
        const sign = config.modifier > 0 ? "+" : "";
        parts.push(`计算：${baseTotal} ${sign}${config.modifier} = ${total}`);
      } else {
        parts.push(`计算：${keptValues.join(" + ")} = ${total}`);
      }

      return parts.join(" ｜ ");
    }

    function addHistory(outcome) {
      const item = {
        id: outcome.id,
        time: outcome.time,
        expression: outcome.expression,
        rolls: outcome.rolls,
        total: outcome.total,
        baseTotal: outcome.baseTotal,
        config: outcome.config,
        detail: buildDetailText(outcome)
      };

      history.unshift(item);
      history = history.slice(0, MAX_HISTORY);
      saveHistory();
      renderHistory();
    }

    function renderHistory() {
      els.historyList.innerHTML = "";

      if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "暂无历史记录";
        els.historyList.appendChild(empty);
        return;
      }

      history.forEach(item => {
        const wrap = document.createElement("div");
        wrap.className = "history-item";

        const main = document.createElement("div");
        main.className = "history-main";

        const expr = document.createElement("div");
        expr.className = "history-expr";
        expr.textContent = `${item.expression} = ${item.total}`;

        const time = document.createElement("div");
        time.className = "history-time";
        time.textContent = formatTime(item.time);

        main.appendChild(expr);
        main.appendChild(time);

        const detail = document.createElement("div");
        detail.className = "history-detail";
        detail.textContent = `结果：[${item.rolls.join(", ")}]`;

        const actions = document.createElement("div");
        actions.className = "history-actions";

        const reroll = document.createElement("button");
        reroll.type = "button";
        reroll.textContent = "再掷";
        reroll.addEventListener("click", () => {
          Object.assign(state, item.config);
          normalizeKeep();
          syncControlsFromState();
          rollDice();
        });

        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "复制";
        copy.addEventListener("click", () => {
          copyText(`${item.expression} = ${item.total}，结果：[${item.rolls.join(", ")}]`);
          toastButton(copy, "已复制");
        });

        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "删除";
        del.className = "danger-btn";
        del.addEventListener("click", () => {
          history = history.filter(record => record.id !== item.id);
          saveHistory();
          renderHistory();
        });

        actions.appendChild(reroll);
        actions.appendChild(copy);
        actions.appendChild(del);

        wrap.appendChild(main);
        wrap.appendChild(detail);
        wrap.appendChild(actions);

        els.historyList.appendChild(wrap);
      });
    }

    function formatOutcomeText(outcome) {
      return `${outcome.expression} = ${outcome.total}，结果：[${outcome.rolls.join(", ")}]`;
    }

    function cloneConfig(config) {
      return {
        count: clamp(toInt(config.count, 1), 1, 100),
        sides: clamp(toInt(config.sides, 6), 2, 10000),
        modifier: clamp(toInt(config.modifier, 0), -999999, 999999),
        rule: ["sum", "kh", "kl"].includes(config.rule) ? config.rule : "sum",
        keep: clamp(toInt(config.keep, 1), 1, clamp(toInt(config.count, 1), 1, 100)),
        animation: Boolean(config.animation),
        duration: clamp(toInt(config.duration, 650), 100, 3000)
      };
    }

    function randomIntInclusive(min, max) {
      min = Math.ceil(min);
      max = Math.floor(max);
      const range = max - min + 1;

      if (range <= 0) {
        return min;
      }

      if (window.crypto && window.crypto.getRandomValues) {
        const maxUint32 = 0xffffffff;
        const limit = maxUint32 - (maxUint32 % range);
        const buffer = new Uint32Array(1);

        let value;
        do {
          window.crypto.getRandomValues(buffer);
          value = buffer[0];
        } while (value >= limit);

        return min + (value % range);
      }

      return Math.floor(Math.random() * range) + min;
    }

    function cryptoId() {
      if (window.crypto && window.crypto.randomUUID) {
        return window.crypto.randomUUID();
      }

      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function toInt(value, fallback) {
      const number = Number.parseInt(value, 10);
      return Number.isFinite(number) ? number : fallback;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      const today = new Date();

      const sameDay =
        date.getFullYear() === today.getFullYear() &&
        date.getMonth() === today.getMonth() &&
        date.getDate() === today.getDate();

      const hh = String(date.getHours()).padStart(2, "0");
      const mm = String(date.getMinutes()).padStart(2, "0");

      if (sameDay) {
        return `${hh}:${mm}`;
      }

      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${month}-${day} ${hh}:${mm}`;
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed.slice(0, MAX_HISTORY) : [];
      } catch {
        return [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch {
        // 如果浏览器禁用 localStorage，则忽略保存失败。
      }
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      } catch {
        // 复制失败时不打断使用。
      }
    }

    function toastButton(button, text) {
      const old = button.textContent;
      button.textContent = text;
      button.disabled = true;

      window.setTimeout(() => {
        button.textContent = old;
        button.disabled = false;
      }, 850);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .then(function () {
            console.log("Service Worker 注册成功");
          })
          .catch(function (error) {
            console.warn("Service Worker 注册失败", error);
          });
      });
    }
  </script>
</body>
