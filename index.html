<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <title>HandyBox</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HandyBox" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    body {
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      min-height: 100dvh;
      padding:
        calc(20px + env(safe-area-inset-top))
        calc(18px + env(safe-area-inset-right))
        calc(20px + env(safe-area-inset-bottom))
        calc(18px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }

    .header {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 20px;
    }

    .title {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.6;
      color: #9ca3af;
    }

    .grid {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .tool-card {
      min-height: 82px;
      padding: 16px;
      border-radius: 18px;
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .tool-card:active {
      transform: scale(0.98);
      background: #374151;
      border-color: rgba(255, 255, 255, 0.16);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-size: 25px;
      background: #374151;
    }

    .tool-title {
      margin-bottom: 4px;
      font-size: 17px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .tool-desc {
      font-size: 13px;
      line-height: 1.45;
      color: #9ca3af;
    }

    .footer {
      max-width: 900px;
      width: 100%;
      margin: auto auto 0;
      padding-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    /*
      竖屏手机：保持单列，方便点击
    */
    @media (orientation: portrait) {
      .app {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    /*
      横屏手机：利用横向空间，变成多列
    */
    @media (orientation: landscape) and (max-height: 520px) {
      .app {
        padding-top: calc(14px + env(safe-area-inset-top));
        padding-bottom: calc(14px + env(safe-area-inset-bottom));
      }

      .header {
        margin-bottom: 14px;
      }

      .title {
        font-size: 26px;
      }

      .subtitle {
        font-size: 13px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .tool-card {
        min-height: 72px;
        padding: 12px;
        border-radius: 16px;
      }

      .icon {
        width: 42px;
        height: 42px;
        font-size: 22px;
      }

      .tool-title {
        font-size: 16px;
      }

      .tool-desc {
        font-size: 12px;
      }

      .footer {
        padding-top: 12px;
      }
    }

    /*
      平板或宽屏：两列布局
    */
    @media (min-width: 720px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .title {
        font-size: 36px;
      }
    }

    /*
      更宽屏幕：三列布局
    */
    @media (min-width: 1080px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <h1 class="title">HandyBox</h1>
      <div class="subtitle">一个放在手机里的轻量工具箱，可离线使用。</div>
    </header>

    <section class="grid">
      <a class="tool-card" href="./guandan.html">
        <div class="icon">🃏</div>
        <div>
          <div class="tool-title">Guan Dan</div>
          <div class="tool-desc">记录红蓝队等级，适合牌局计分。</div>
        </div>
      </a>

      <a class="tool-card" href="./cardBox.html">
        <div class="icon">🎴</div>
        <div>
          <div class="tool-title">Card Box</div>
          <div class="tool-desc">抽牌、随机卡牌、简单桌游辅助。</div>
        </div>
      </a>

      <a class="tool-card" href="./randomPick.html">
        <div class="icon">❓</div>
        <div>
          <div class="tool-title">Random Pick</div>
          <div class="tool-desc">随机数、随机选择。</div>
        </div>
      </a>

      <a class="tool-card" href="./dice.html">
        <div class="icon">🎲</div>
        <div>
          <div class="tool-title">Dice</div>
          <div class="tool-desc">随机掷骰，适合桌游和临时决策。</div>
        </div>
      </a>

      <a class="tool-card" href="./pomodoro.html">
        <div class="icon">⏱️</div>
        <div>
          <div class="tool-title">Pomodoro</div>
          <div class="tool-desc">专注计时、休息提醒。</div>
        </div>
      </a>
    </section>

    <div class="footer">
      HandyBox · 离线可用的小工具箱
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .then(function () {
            console.log("Service Worker 注册成功");
          })
          .catch(function (error) {
            console.warn("Service Worker 注册失败", error);
          });
      });
    }
  </script>
</body>
</html>
