<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>生命条计数器</title>

  <style>
    :root {
      --bg: #09090b;
      --text: #fafafa;
      --muted: rgba(255, 255, 255, 0.68);
      --border: rgba(255, 255, 255, 0.14);
      --panel: rgba(24, 24, 27, 0.92);
      --radius: 24px;
      --gap: clamp(8px, 1.8vmin, 16px);
      --topbar-h: 42px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      user-select: none;
      touch-action: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100svh;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 12% 0%, rgba(59, 130, 246, 0.24), transparent 34%),
        radial-gradient(circle at 90% 100%, rgba(244, 63, 94, 0.22), transparent 36%),
        linear-gradient(135deg, #020617, #09090b 48%, #111827);
    }

    .topbar {
      height: var(--topbar-h);
      flex: 0 0 auto;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 9, 11, 0.74);
      backdrop-filter: blur(16px);
    }

    .title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-btn {
      flex: 0 0 auto;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    .top-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.18);
    }

    .top-btn.danger {
      background: rgba(225, 29, 72, 0.78);
    }

    .top-btn.primary {
      background: rgba(37, 99, 235, 0.82);
    }

    .board {
      flex: 1 1 auto;
      min-height: 0;
      padding: var(--gap);
      display: grid;
      gap: var(--gap);
    }

    .board.players-1 {
      grid-template: 1fr / 1fr;
    }

    .board.players-2 {
      grid-template: repeat(2, minmax(0, 1fr)) / 1fr;
    }

    .board.players-3 {
      grid-template: repeat(3, minmax(0, 1fr)) / 1fr;
    }

    .board.players-4 {
      grid-template: repeat(2, minmax(0, 1fr)) / repeat(2, minmax(0, 1fr));
    }

    .life-card {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.09), transparent 38%),
        rgba(255, 255, 255, 0.06);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.38),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      isolation: isolate;
      touch-action: none;
      cursor: pointer;
    }

    .life-card.dragging {
      transform: scale(0.992);
    }

    .life-track {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02)),
        rgba(0, 0, 0, 0.28);
      z-index: 0;
    }

    .life-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      background:
        linear-gradient(
          90deg,
          color-mix(in srgb, var(--accent) 58%, #000),
          var(--accent) 62%,
          color-mix(in srgb, var(--accent) 76%, #fff)
        );
      box-shadow:
        0 0 34px color-mix(in srgb, var(--accent) 42%, transparent),
        inset 0 0 22px rgba(255, 255, 255, 0.18);
      transition:
        width 120ms ease,
        background 160ms ease;
      z-index: 1;
    }

    .life-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.28) 18%,
          transparent 34%,
          transparent 100%
        );
      mix-blend-mode: screen;
      opacity: 0.62;
    }

    .life-card.low .life-fill {
      background:
        linear-gradient(90deg, #7f1d1d, #ef4444 60%, #fb7185);
      box-shadow:
        0 0 34px rgba(239, 68, 68, 0.45),
        inset 0 0 22px rgba(255, 255, 255, 0.16);
    }

    .life-card.over .life-fill {
      background:
        linear-gradient(90deg, #065f46, #22c55e 58%, #a7f3d0);
      box-shadow:
        0 0 42px rgba(34, 197, 94, 0.48),
        inset 0 0 22px rgba(255, 255, 255, 0.2);
    }

    .life-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: clamp(12px, 3vmin, 26px);
      display: grid;
      grid-template:
        "name meta" auto
        "value value" 1fr
        "hint hint" auto
        / 1fr auto;
      gap: 4px 10px;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.52);
    }

    .player-name {
      grid-area: name;
      align-self: start;
      min-width: 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(15px, 3vmin, 24px);
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .life-meta {
      grid-area: meta;
      justify-self: end;
      align-self: start;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(11px, 2.2vmin, 14px);
      font-weight: 800;
      white-space: nowrap;
    }

    .life-value {
      grid-area: value;
      align-self: center;
      justify-self: center;
      line-height: 0.86;
      letter-spacing: -0.09em;
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      font-size: clamp(60px, 24vmin, 210px);
    }

    .players-1 .life-value {
      font-size: clamp(96px, 38vmin, 310px);
    }

    .players-3 .life-value,
    .players-4 .life-value {
      font-size: clamp(42px, 15vmin, 132px);
    }

    .life-hint {
      grid-area: hint;
      justify-self: center;
      color: rgba(255, 255, 255, 0.74);
      font-size: clamp(11px, 2.2vmin, 15px);
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .swipe-indicator {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
      z-index: 3;
    }

    .swipe-indicator span {
      display: block;
      width: 50%;
      height: 100%;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.42);
      transform: translateX(50%);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(12px);
    }

    .modal.hidden {
      display: none;
    }

    .editor {
      width: min(520px, 100%);
      max-height: calc(100dvh - 24px);
      overflow: auto;
      border-radius: 24px;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 34%),
        rgba(24, 24, 27, 0.96);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.52);
      padding: 16px;
    }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .editor-title {
      flex: 1;
      font-size: 18px;
      font-weight: 1000;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 20px;
      font-weight: 900;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      outline: none;
      color: #fff;
      background: rgba(0, 0, 0, 0.26);
      padding: 0 12px;
      font-weight: 800;
    }

    .field input[type="color"] {
      padding: 4px;
      height: 44px;
    }

    .field input[type="range"] {
      padding: 0;
      accent-color: var(--accent, #3b82f6);
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin-top: 2px;
    }

    .quick-row button {
      min-height: 38px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.1);
      font-weight: 1000;
    }

    .quick-row button:active,
    .close-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.18);
    }

    .editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .editor-actions button {
      min-height: 44px;
      border-radius: 15px;
      font-weight: 1000;
    }

    .editor-actions .ok {
      background: #2563eb;
    }

    .editor-actions .reset-one {
      background: rgba(225, 29, 72, 0.82);
    }

    @media (orientation: landscape) {
      :root {
        --topbar-h: 38px;
        --gap: clamp(6px, 1.4vmin, 12px);
      }

      .topbar {
        padding-block: 4px;
      }

      .top-btn {
        height: 28px;
      }

      .board.players-2 {
        grid-template: 1fr / repeat(2, minmax(0, 1fr));
      }

      .board.players-3 {
        grid-template: 1fr / repeat(3, minmax(0, 1fr));
      }

      .board.players-4 {
        grid-template: repeat(2, minmax(0, 1fr)) / repeat(2, minmax(0, 1fr));
      }

      .life-value {
        font-size: clamp(52px, 19vmin, 170px);
      }

      .players-1 .life-value {
        font-size: clamp(90px, 34vmin, 270px);
      }

      .players-3 .life-value,
      .players-4 .life-value {
        font-size: clamp(38px, 13vmin, 112px);
      }

      .editor {
        width: min(760px, 100%);
      }

      .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field.full {
        grid-column: 1 / -1;
      }
    }

    @media (max-height: 520px) {
      .life-hint {
        display: none;
      }

      .life-content {
        padding: 10px 12px;
      }

      .player-name {
        font-size: 13px;
      }

      .life-meta {
        font-size: 11px;
      }

      .editor {
        padding: 12px;
      }
    }

    @media (max-width: 380px) {
      .top-btn {
        padding-inline: 8px;
        font-size: 12px;
      }

      .title {
        font-size: 12px;
      }

      .quick-row {
        gap: 5px;
      }

      .quick-row button {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div id="statusTitle" class="title">滑动生命条增减，点击编辑</div>
      <button id="openSettingsBtn" class="top-btn primary" type="button">设置</button>
      <button id="resetAllBtn" class="top-btn danger" type="button">重置</button>
      <button id="wakeBtn" class="top-btn" type="button">常亮</button>
    </header>

    <main id="board" class="board" aria-label="生命条区域"></main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="编辑生命条">
    <section class="editor">
      <div class="editor-head">
        <div class="editor-title">编辑生命条</div>
        <button id="closeModalBtn" class="close-btn" type="button" aria-label="关闭">×</button>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="playerCountInput">显示玩家数量</label>
          <select id="playerCountInput">
            <option value="1">1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
          </select>
        </div>

        <div class="field">
          <label for="editPlayerInput">当前编辑玩家</label>
          <select id="editPlayerInput"></select>
        </div>

        <div class="field">
          <label for="playerNameInput">玩家名称</label>
          <input id="playerNameInput" type="text" maxlength="16" autocomplete="off" />
        </div>

        <div class="field">
          <label for="playerColorInput">生命条颜色</label>
          <input id="playerColorInput" type="color" />
        </div>

        <div class="field">
          <label for="lifeValueInput">当前生命</label>
          <input id="lifeValueInput" type="number" inputmode="numeric" />
        </div>

        <div class="field">
          <label for="lifeMaxInput">生命上限 / 满血值</label>
          <input id="lifeMaxInput" type="number" inputmode="numeric" min="1" />
        </div>

        <div class="field">
          <label for="stepInput">滑动步进</label>
          <select id="stepInput">
            <option value="1">每格 ±1</option>
            <option value="2">每格 ±2</option>
            <option value="5">每格 ±5</option>
            <option value="10">每格 ±10</option>
          </select>
        </div>

        <div class="field">
          <label for="lifeRangeInput">拖动调整生命</label>
          <input id="lifeRangeInput" type="range" min="0" max="40" step="1" />
        </div>

        <div class="field full">
          <label>快速调整</label>
          <div class="quick-row">
            <button type="button" data-quick="-10">-10</button>
            <button type="button" data-quick="-5">-5</button>
            <button type="button" data-quick="-1">-1</button>
            <button type="button" data-quick="1">+1</button>
            <button type="button" data-quick="5">+5</button>
            <button type="button" data-quick="10">+10</button>
          </div>
        </div>
      </div>

      <div class="editor-actions">
        <button id="resetOneBtn" class="reset-one" type="button">当前玩家满血</button>
        <button id="doneBtn" class="ok" type="button">完成</button>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "mobile-life-bar-counter-v2";

    const defaultState = {
      count: 2,
      step: 1,
      players: [
        { name: "玩家 1", value: 20, max: 20, color: "#ef4444" },
        { name: "玩家 2", value: 20, max: 20, color: "#3b82f6" },
        { name: "玩家 3", value: 20, max: 20, color: "#22c55e" },
        { name: "玩家 4", value: 20, max: 20, color: "#a855f7" }
      ]
    };

    let state = loadState();
    let activeIndex = 0;
    let wakeLock = null;
    let gesture = null;

    const board = document.getElementById("board");
    const statusTitle = document.getElementById("statusTitle");
    const openSettingsBtn = document.getElementById("openSettingsBtn");
    const resetAllBtn = document.getElementById("resetAllBtn");
    const wakeBtn = document.getElementById("wakeBtn");

    const modal = document.getElementById("modal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const doneBtn = document.getElementById("doneBtn");
    const resetOneBtn = document.getElementById("resetOneBtn");

    const playerCountInput = document.getElementById("playerCountInput");
    const editPlayerInput = document.getElementById("editPlayerInput");
    const playerNameInput = document.getElementById("playerNameInput");
    const playerColorInput = document.getElementById("playerColorInput");
    const lifeValueInput = document.getElementById("lifeValueInput");
    const lifeMaxInput = document.getElementById("lifeMaxInput");
    const stepInput = document.getElementById("stepInput");
    const lifeRangeInput = document.getElementById("lifeRangeInput");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || typeof saved !== "object") {
          return structuredClone(defaultState);
        }

        const merged = structuredClone(defaultState);

        merged.count = clamp(Number(saved.count), 1, 4, defaultState.count);
        merged.step = clamp(Number(saved.step), 1, 10, defaultState.step);

        if (Array.isArray(saved.players)) {
          saved.players.slice(0, 4).forEach((player, index) => {
            merged.players[index] = {
              ...merged.players[index],
              ...player
            };

            merged.players[index].value = Number(merged.players[index].value) || 0;
            merged.players[index].max = Math.max(1, Number(merged.players[index].max) || 20);
            merged.players[index].name = String(merged.players[index].name || `玩家 ${index + 1}`);
            merged.players[index].color = String(merged.players[index].color || merged.players[index].color);
          });
        }

        return merged;
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function clamp(value, min, max, fallback) {
      if (!Number.isFinite(value)) return fallback;
      return Math.min(max, Math.max(min, value));
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPercent(player) {
      const max = Math.max(1, Number(player.max) || 1);
      const value = Number(player.value) || 0;
      return Math.min(100, Math.max(0, (value / max) * 100));
    }

    function getCardClass(player) {
      const max = Math.max(1, Number(player.max) || 1);
      const value = Number(player.value) || 0;

      if (value > max) return "over";
      if (value <= max * 0.25) return "low";
      return "";
    }

    function render() {
      board.className = `board players-${state.count}`;
      statusTitle.textContent = `${state.count} 人 · 左右滑动增减 · 点击编辑`;

      board.innerHTML = state.players
        .slice(0, state.count)
        .map((player, index) => {
          const percent = getPercent(player);
          const extraClass = getCardClass(player);
          const name = escapeHTML(player.name || `玩家 ${index + 1}`);
          const value = Number(player.value) || 0;
          const max = Math.max(1, Number(player.max) || 1);
          const color = player.color || "#3b82f6";

          return `
            <section
              class="life-card ${extraClass}"
              data-index="${index}"
              style="--accent: ${color};"
              role="slider"
              aria-label="${name} 生命值"
              aria-valuemin="0"
              aria-valuemax="${max}"
              aria-valuenow="${value}"
            >
              <div class="life-track"></div>
              <div class="life-fill" style="width: ${percent}%;"></div>

              <div class="life-content">
                <div class="player-name">${name}</div>
                <div class="life-meta">上限 ${max}</div>
                <div class="life-value">${value}</div>
                <div class="life-hint">← 滑动减少　点击编辑　滑动增加 →</div>
              </div>

              <div class="swipe-indicator"><span></span></div>
            </section>
          `;
        })
        .join("");

      saveState();
      syncWakeButton();
    }

    function updateCard(index) {
      const player = state.players[index];
      const card = board.querySelector(`.life-card[data-index="${index}"]`);
      if (!player || !card) return;

      const percent = getPercent(player);
      const value = Number(player.value) || 0;
      const max = Math.max(1, Number(player.max) || 1);

      card.classList.toggle("low", getCardClass(player) === "low");
      card.classList.toggle("over", getCardClass(player) === "over");
      card.setAttribute("aria-valuemax", String(max));
      card.setAttribute("aria-valuenow", String(value));

      const fill = card.querySelector(".life-fill");
      const valueEl = card.querySelector(".life-value");
      const metaEl = card.querySelector(".life-meta");

      if (fill) fill.style.width = `${percent}%`;
      if (valueEl) valueEl.textContent = String(value);
      if (metaEl) metaEl.textContent = `上限 ${max}`;

      saveState();
    }

    function changeValue(index, delta) {
      const player = state.players[index];
      if (!player) return;

      player.value = Number(player.value || 0) + Number(delta || 0);
      updateCard(index);

      if (!modal.classList.contains("hidden") && index === activeIndex) {
        fillEditorFields();
      }
    }

    function openEditor(index = 0) {
      activeIndex = clamp(index, 0, state.count - 1, 0);
      rebuildEditorPlayerSelect();
      fillEditorFields();
      modal.classList.remove("hidden");
    }

    function closeEditor() {
      modal.classList.add("hidden");
    }

    function rebuildEditorPlayerSelect() {
      playerCountInput.value = String(state.count);
      stepInput.value = String(state.step);

      editPlayerInput.innerHTML = state.players
        .slice(0, state.count)
        .map((player, index) => {
          const name = escapeHTML(player.name || `玩家 ${index + 1}`);
          return `<option value="${index}">${index + 1}. ${name}</option>`;
        })
        .join("");

      editPlayerInput.value = String(activeIndex);
    }

    function fillEditorFields() {
      const player = state.players[activeIndex];
      if (!player) return;

      const max = Math.max(1, Number(player.max) || 1);
      const value = Number(player.value) || 0;
      const rangeMax = Math.max(max * 2, value, 40);

      playerNameInput.value = player.name || `玩家 ${activeIndex + 1}`;
      playerColorInput.value = player.color || "#3b82f6";
      lifeValueInput.value = String(value);
      lifeMaxInput.value = String(max);

      lifeRangeInput.min = "0";
      lifeRangeInput.max = String(rangeMax);
      lifeRangeInput.step = "1";
      lifeRangeInput.value = String(Math.max(0, value));

      document.documentElement.style.setProperty("--accent", player.color || "#3b82f6");
    }

    function updateActivePlayerFromEditor() {
      const player = state.players[activeIndex];
      if (!player) return;

      player.name = playerNameInput.value.trim() || `玩家 ${activeIndex + 1}`;
      player.color = playerColorInput.value || player.color;
      player.value = Number(lifeValueInput.value) || 0;
      player.max = Math.max(1, Number(lifeMaxInput.value) || 1);

      render();
      rebuildEditorPlayerSelect();
      editPlayerInput.value = String(activeIndex);
      fillEditorFields();
    }

    board.addEventListener("pointerdown", (event) => {
      const card = event.target.closest(".life-card");
      if (!card) return;

      const index = Number(card.dataset.index);

      gesture = {
        index,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        lastX: event.clientX,
        moved: false,
        card
      };

      card.classList.add("dragging");

      try {
        card.setPointerCapture(event.pointerId);
      } catch {
        // 忽略部分浏览器不支持 setPointerCapture 的情况。
      }
    });

    board.addEventListener("pointermove", (event) => {
      if (!gesture) return;

      const dxTotal = event.clientX - gesture.startX;
      const dyTotal = event.clientY - gesture.startY;

      if (Math.abs(dxTotal) > 8 || Math.abs(dyTotal) > 8) {
        gesture.moved = true;
      }

      const pixelsPerStep = 24;
      const dx = event.clientX - gesture.lastX;
      const units = Math.trunc(dx / pixelsPerStep);

      if (units !== 0) {
        changeValue(gesture.index, units * state.step);
        gesture.lastX += units * pixelsPerStep;
      }
    });

    function finishGesture() {
      if (!gesture) return;

      const currentGesture = gesture;
      currentGesture.card.classList.remove("dragging");

      if (!currentGesture.moved) {
        openEditor(currentGesture.index);
      }

      gesture = null;
    }

    board.addEventListener("pointerup", finishGesture);
    board.addEventListener("pointercancel", finishGesture);
    window.addEventListener("blur", () => {
      if (gesture?.card) {
        gesture.card.classList.remove("dragging");
      }
      gesture = null;
    });

    openSettingsBtn.addEventListener("click", () => {
      openEditor(Math.min(activeIndex, state.count - 1));
    });

    resetAllBtn.addEventListener("click", () => {
      const ok = confirm("确定把当前显示的所有玩家恢复到满血吗？");
      if (!ok) return;

      for (let i = 0; i < state.count; i++) {
        state.players[i].value = Math.max(1, Number(state.players[i].max) || 20);
      }

      render();

      if (!modal.classList.contains("hidden")) {
        fillEditorFields();
      }
    });

    closeModalBtn.addEventListener("click", closeEditor);
    doneBtn.addEventListener("click", closeEditor);

    modal.addEventListener("pointerdown", (event) => {
      if (event.target === modal) {
        closeEditor();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeEditor();
      }
    });

    playerCountInput.addEventListener("change", () => {
      state.count = clamp(Number(playerCountInput.value), 1, 4, 2);
      activeIndex = Math.min(activeIndex, state.count - 1);
      render();
      rebuildEditorPlayerSelect();
      fillEditorFields();
    });

    editPlayerInput.addEventListener("change", () => {
      activeIndex = clamp(Number(editPlayerInput.value), 0, state.count - 1, 0);
      fillEditorFields();
    });

    stepInput.addEventListener("change", () => {
      state.step = clamp(Number(stepInput.value), 1, 10, 1);
      saveState();
    });

    playerNameInput.addEventListener("input", updateActivePlayerFromEditor);
    playerColorInput.addEventListener("input", updateActivePlayerFromEditor);

    lifeValueInput.addEventListener("input", () => {
      const player = state.players[activeIndex];
      if (!player) return;

      player.value = Number(lifeValueInput.value) || 0;
      updateCard(activeIndex);
      fillEditorFields();
    });

    lifeMaxInput.addEventListener("input", () => {
      const player = state.players[activeIndex];
      if (!player) return;

      player.max = Math.max(1, Number(lifeMaxInput.value) || 1);
      render();
      fillEditorFields();
    });

    lifeRangeInput.addEventListener("input", () => {
      const player = state.players[activeIndex];
      if (!player) return;

      player.value = Number(lifeRangeInput.value) || 0;
      lifeValueInput.value = String(player.value);
      updateCard(activeIndex);
    });

    document.querySelector(".quick-row").addEventListener("click", (event) => {
      const button = event.target.closest("[data-quick]");
      if (!button) return;

      changeValue(activeIndex, Number(button.dataset.quick));
    });

    resetOneBtn.addEventListener("click", () => {
      const player = state.players[activeIndex];
      if (!player) return;

      player.value = Math.max(1, Number(player.max) || 20);
      updateCard(activeIndex);
      fillEditorFields();
    });

    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) {
        alert("当前浏览器不支持屏幕常亮。");
        return;
      }

      try {
        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
          wakeLock = null;
          syncWakeButton();
        });

        syncWakeButton();
      } catch {
        alert("无法开启屏幕常亮。通常需要 HTTPS 或安装为 PWA 后使用。");
      }
    }

    async function releaseWakeLock() {
      if (!wakeLock) return;

      try {
        await wakeLock.release();
      } finally {
        wakeLock = null;
        syncWakeButton();
      }
    }

    function syncWakeButton() {
      wakeBtn.textContent = wakeLock ? "常亮中" : "常亮";
    }

    wakeBtn.addEventListener("click", async () => {
      if (wakeLock) {
        await releaseWakeLock();
      } else {
        await requestWakeLock();
      }
    });

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && wakeLock) {
        await requestWakeLock();
      }
    });

    render();
  </script>
</body>
</html>
