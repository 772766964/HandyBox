<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Russian Roulette - 横屏互动版</title>
  <style>
    :root {
      --bg1: #101014;
      --bg2: #1b1b24;
      --metal-dark: #2b2d33;
      --metal-mid: #575b66;
      --metal-light: #a4a9b4;
      --gold: #d7a84f;
      --gold-dark: #8b6120;
      --danger: #d63c3c;
      --success: #4cc47a;
      --text: #f2f2f2;
      --muted: #9da3ad;
      --angle: 0deg;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, #292936 0%, var(--bg2) 45%, var(--bg1) 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 320px;
      overflow: hidden;
    }

    .app.shake {
      animation: screenShake 0.32s ease;
    }

    @keyframes screenShake {
      0% {
        transform: translate(0, 0);
      }

      15% {
        transform: translate(-8px, 3px);
      }

      30% {
        transform: translate(7px, -4px);
      }

      45% {
        transform: translate(-5px, 5px);
      }

      60% {
        transform: translate(4px, -3px);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    .portrait-tip {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background:
        radial-gradient(circle at center, #272733 0%, #111118 70%);
      color: #fff;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      text-align: center;
      padding: 24px;
    }

    .portrait-tip .phone {
      width: 56px;
      height: 92px;
      border: 4px solid #fff;
      border-radius: 14px;
      position: relative;
      animation: rotatePhone 1.6s ease-in-out infinite;
    }

    .portrait-tip .phone::after {
      content: "";
      width: 14px;
      height: 4px;
      background: #fff;
      border-radius: 999px;
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
    }

    @keyframes rotatePhone {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(90deg);
      }
    }

    @media (orientation: portrait) {
      .portrait-tip {
        display: flex;
      }
    }

    .hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .title {
      line-height: 1.1;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
      flex: 0 0 auto;
    }

    .title strong {
      display: block;
      font-size: clamp(18px, 3vw, 36px);
      letter-spacing: 0.08em;
    }

    .title span {
      display: block;
      margin-top: 4px;
      font-size: clamp(11px, 1.5vw, 15px);
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: auto;
      max-width: 65vw;
    }

    .pill {
      min-width: 112px;
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(10px);
      color: #fff;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: clamp(12px, 1.5vw, 15px);
      white-space: nowrap;
    }

    .btn {
      border: 0;
      outline: 0;
      padding: 10px 15px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f0f0f0, #aeb3bd);
      color: #151515;
      font-weight: 800;
      font-size: clamp(12px, 1.5vw, 15px);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn.danger {
      background: linear-gradient(180deg, #ff7474, #b92323);
      color: #fff;
    }

    .btn.fire {
      background: linear-gradient(180deg, #ffdc82, #c87812 55%, #8d3f06);
      color: #241100;
      box-shadow:
        0 8px 24px rgba(240, 132, 24, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .btn.success {
      background: linear-gradient(180deg, #89ffb0, #25a85a);
      color: #06230f;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
    }

    .revolver {
      position: relative;
      width: min(92vw, 1120px);
      height: min(68vh, 520px);
      filter:
        drop-shadow(0 34px 28px rgba(0, 0, 0, 0.55)) drop-shadow(0 8px 8px rgba(0, 0, 0, 0.35));
      transform-origin: 45% 52%;
    }

    .revolver.recoil {
      animation: recoil 0.22s ease-out;
    }

    .revolver.dry {
      animation: dryKick 0.12s ease-out;
    }

    @keyframes recoil {
      0% {
        transform: translate(0, 0) rotate(0);
      }

      35% {
        transform: translate(-22px, 9px) rotate(-3deg);
      }

      100% {
        transform: translate(0, 0) rotate(0);
      }
    }

    @keyframes dryKick {
      0% {
        transform: translateX(0);
      }

      45% {
        transform: translateX(-4px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .barrel {
      position: absolute;
      left: 54%;
      top: 28%;
      width: 43%;
      height: 17%;
      border-radius: 0 28px 28px 0;
      background:
        linear-gradient(180deg, #c7ccd5 0%, #727783 16%, #30333a 50%, #777d88 84%, #d4d8df 100%);
      box-shadow:
        inset 0 4px 8px rgba(255, 255, 255, 0.35),
        inset 0 -7px 12px rgba(0, 0, 0, 0.45);
      z-index: 6;
    }

    .barrel::before {
      content: "";
      position: absolute;
      right: 3%;
      top: 26%;
      width: 18%;
      height: 48%;
      border-radius: 0 20px 20px 0;
      background:
        radial-gradient(circle at 78% 50%, #111 0 18%, #333 19% 28%, transparent 29%),
        linear-gradient(180deg, #353943, #15171b);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.9);
    }

    .muzzle-flash {
      position: absolute;
      left: 93%;
      top: 24%;
      width: 18%;
      height: 26%;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      transform-origin: left center;
      background:
        radial-gradient(circle at 0% 50%, #fff8c5 0 8%, transparent 9%),
        radial-gradient(circle at 18% 50%, rgba(255, 230, 120, 0.95) 0 18%, transparent 20%),
        conic-gradient(from 0deg at 0% 50%,
          transparent 0deg,
          rgba(255, 205, 62, 0.95) 25deg,
          rgba(255, 112, 32, 0.95) 55deg,
          transparent 85deg,
          transparent 140deg,
          rgba(255, 225, 95, 0.9) 185deg,
          rgba(255, 92, 24, 0.9) 220deg,
          transparent 260deg,
          transparent 360deg);
      filter: blur(0.2px) drop-shadow(0 0 24px rgba(255, 160, 40, 0.9));
      clip-path: polygon(0 50%, 20% 35%, 42% 10%, 48% 38%, 100% 50%, 48% 62%, 42% 90%, 20% 65%);
    }

    .muzzle-flash.show {
      animation: muzzle 0.16s ease-out;
    }

    @keyframes muzzle {
      0% {
        opacity: 0;
        transform: scaleX(0.4) scaleY(0.5);
      }

      35% {
        opacity: 1;
        transform: scaleX(1.15) scaleY(1);
      }

      100% {
        opacity: 0;
        transform: scaleX(1.35) scaleY(0.8);
      }
    }

    .top-rail {
      position: absolute;
      left: 49%;
      top: 19%;
      width: 40%;
      height: 8%;
      border-radius: 22px 22px 10px 10px;
      background:
        linear-gradient(180deg, #e1e4ea, #7a808b 45%, #363941);
      transform: skewX(-10deg);
      z-index: 5;
    }

    .under-barrel {
      position: absolute;
      left: 55%;
      top: 45%;
      width: 32%;
      height: 8%;
      border-radius: 0 0 20px 20px;
      background:
        linear-gradient(180deg, #5d636e, #22252b);
      z-index: 4;
    }

    .frame {
      position: absolute;
      left: 27%;
      top: 22%;
      width: 37%;
      height: 38%;
      border-radius: 48% 28% 34% 46%;
      background:
        radial-gradient(circle at 45% 45%, rgba(255, 255, 255, 0.18), transparent 34%),
        linear-gradient(135deg, #c6cad1 0%, #777d88 34%, #2d3038 72%, #17191e 100%);
      box-shadow:
        inset 0 8px 18px rgba(255, 255, 255, 0.22),
        inset 0 -14px 24px rgba(0, 0, 0, 0.45);
      z-index: 3;
    }

    .frame::before {
      content: "";
      position: absolute;
      left: 6%;
      top: 56%;
      width: 39%;
      height: 48%;
      border-radius: 0 0 56% 56%;
      background:
        radial-gradient(circle at 50% 28%, transparent 0 34%, #202229 36% 100%);
      box-shadow: inset 0 0 0 10px rgba(110, 116, 126, 0.75);
    }

    .hammer {
      position: absolute;
      left: 21%;
      top: 17%;
      width: 14%;
      height: 18%;
      border-radius: 70% 18% 16% 28%;
      background:
        linear-gradient(135deg, #bfc4ce, #555b66 55%, #22252b);
      transform: rotate(-18deg);
      transform-origin: 80% 80%;
      z-index: 2;
    }

    .grip {
      position: absolute;
      left: 25%;
      top: 54%;
      width: 23%;
      height: 43%;
      border-radius: 18% 22% 38% 48%;
      background:
        radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.16), transparent 20%),
        linear-gradient(135deg, #7a421d, #3a1d0e 58%, #1a0d07);
      transform: rotate(18deg);
      box-shadow:
        inset 12px 0 16px rgba(255, 255, 255, 0.08),
        inset -10px -14px 22px rgba(0, 0, 0, 0.48);
      z-index: 1;
    }

    .grip::before,
    .grip::after {
      content: "";
      position: absolute;
      left: 18%;
      width: 64%;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: 0 18px 0 rgba(255, 255, 255, 0.1), 0 36px 0 rgba(255, 255, 255, 0.08);
    }

    .grip::before {
      top: 24%;
      transform: rotate(-8deg);
    }

    .grip::after {
      top: 36%;
      transform: rotate(-8deg);
    }

    .trigger {
      position: absolute;
      left: 38%;
      top: 54%;
      width: 9%;
      height: 22%;
      border-radius: 0 0 50% 50%;
      border: 8px solid #30333a;
      border-top: 0;
      transform: rotate(-5deg);
      background: transparent;
      z-index: 7;
    }

    .trigger::after {
      content: "";
      position: absolute;
      left: 44%;
      top: 10%;
      width: 30%;
      height: 58%;
      border-radius: 999px;
      background: linear-gradient(180deg, #c1c6cf, #343840);
      transform: rotate(-12deg);
    }

    .cylinder-wrap {
      position: absolute;
      left: 38%;
      top: 28%;
      width: min(27vh, 25vw);
      height: min(27vh, 25vw);
      min-width: 170px;
      min-height: 170px;
      max-width: 260px;
      max-height: 260px;
      transform: translate(-50%, -3%);
      border-radius: 50%;
      z-index: 8;
      display: grid;
      place-items: center;
    }

    .aim-marker {
      position: absolute;
      right: -22px;
      top: 50%;
      width: 34px;
      height: 6px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 220, 120, 0.85));
      box-shadow: 0 0 16px rgba(255, 210, 90, 0.5);
      pointer-events: none;
      z-index: 10;
    }

    .cylinder {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      cursor: grab;
      touch-action: none;
      transform: rotate(var(--angle));
      background:
        radial-gradient(circle at 50% 50%, #1b1d22 0 10%, transparent 11%),
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.18), transparent 20%),
        conic-gradient(from 20deg,
          #2c2f37,
          #8e949e,
          #343841,
          #c4c8d0,
          #3b3f49,
          #707682,
          #282b32);
      box-shadow:
        inset 0 0 0 8px rgba(18, 19, 24, 0.9),
        inset 0 0 0 16px rgba(255, 255, 255, 0.08),
        inset 0 18px 28px rgba(255, 255, 255, 0.18),
        inset 0 -24px 30px rgba(0, 0, 0, 0.48),
        0 10px 26px rgba(0, 0, 0, 0.45);
      transition: box-shadow 0.15s ease;
    }

    .cylinder.dragging {
      cursor: grabbing;
      box-shadow:
        inset 0 0 0 8px rgba(18, 19, 24, 0.9),
        inset 0 0 0 16px rgba(255, 255, 255, 0.08),
        inset 0 18px 28px rgba(255, 255, 255, 0.18),
        inset 0 -24px 30px rgba(0, 0, 0, 0.48),
        0 0 0 5px rgba(215, 168, 79, 0.24),
        0 14px 30px rgba(0, 0, 0, 0.55);
    }

    .cylinder::before {
      content: "";
      position: absolute;
      inset: 41%;
      border-radius: 50%;
      background:
        radial-gradient(circle, #d5dae2 0 18%, #676d78 20% 58%, #1b1e24 60% 100%);
      box-shadow:
        inset 0 3px 4px rgba(255, 255, 255, 0.35),
        inset 0 -5px 7px rgba(0, 0, 0, 0.55);
      z-index: 3;
    }

    .chamber {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28%;
      height: 28%;
      margin-left: -14%;
      margin-top: -14%;
      border: 0;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 50%, #06070a 0 45%, #2d3139 47% 62%, #a0a6b0 64% 72%, #292d35 74% 100%);
      box-shadow:
        inset 0 6px 10px rgba(255, 255, 255, 0.12),
        inset 0 -8px 12px rgba(0, 0, 0, 0.7),
        0 2px 8px rgba(0, 0, 0, 0.45);
      transform:
        rotate(calc(var(--i) * 60deg)) translateY(-95%);
      pointer-events: none;
    }

    .chamber::before {
      content: "";
      width: 44%;
      height: 44%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #24262c, #050608 75%);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
      transition: all 0.16s ease;
    }

    .chamber.loaded::before {
      width: 58%;
      height: 58%;
      background:
        radial-gradient(circle at 34% 28%, #ffe19a 0 14%, #d7a84f 16% 43%, #8b6120 45% 72%, #3a260b 74% 100%);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.55),
        inset 0 -5px 8px rgba(0, 0, 0, 0.42),
        0 0 14px rgba(215, 168, 79, 0.55);
    }

    .chamber.loaded::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      top: 31%;
      left: 33%;
    }

    .chamber.active {
      outline: 3px solid rgba(255, 220, 120, 0.9);
      outline-offset: 2px;
    }

    .instruction {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 25;
      width: min(850px, 90vw);
      text-align: center;
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(12px, 1.45vw, 15px);
      letter-spacing: 0.06em;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(10px);
    }

    .screen-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 72% 38%, rgba(255, 226, 140, 0.55), transparent 22%),
        rgba(255, 255, 255, 0.08);
      transition: opacity 0.16s ease;
      z-index: 18;
    }

    .screen-flash.show {
      opacity: 1;
    }

    @media (max-height: 430px) {
      .instruction {
        display: none;
      }

      .hud {
        top: 8px;
      }

      .revolver {
        height: 78vh;
      }
    }

    @media (max-width: 820px) {
      .stats {
        gap: 6px;
        max-width: 68vw;
      }

      .btn {
        padding: 8px 10px;
      }

      .pill {
        min-width: 92px;
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="portrait-tip">
    <div class="phone"></div>
    <h2>请横屏体验</h2>
    <p>该页面已针对手机横屏布局优化</p>
  </div>

  <main class="app" id="app">
    <div class="screen-flash" id="screenFlash"></div>

    <header class="hud">
      <div class="title">
        <strong>RUSSIAN ROULETTE</strong>
        <span>俄罗斯轮盘 · 横屏互动版</span>
      </div>

      <div class="stats">
        <div class="pill" id="countText">子弹 1 / 6</div>
        <div class="pill" id="statusText">位置隐藏</div>
        <button class="btn fire" id="fireBtn" type="button">开枪</button>
        <button class="btn success" id="revealBtn" type="button">查看子弹</button>
        <button class="btn" id="reloadBtn" type="button">重新装弹</button>
        <button class="btn" id="spinBtn" type="button">随机旋转</button>
        <button class="btn danger" id="clearBtn" type="button">清空</button>
      </div>
    </header>

    <section class="scene">
      <div class="revolver" id="revolver" aria-label="CSS 风格化左轮">
        <div class="hammer"></div>
        <div class="top-rail"></div>
        <div class="barrel"></div>
        <div class="muzzle-flash" id="muzzleFlash"></div>
        <div class="under-barrel"></div>
        <div class="frame"></div>
        <div class="grip"></div>
        <div class="trigger"></div>

        <div class="cylinder-wrap">
          <div class="aim-marker"></div>
          <div class="cylinder" id="cylinder" aria-label="可旋转弹膛">
            <button class="chamber" style="--i:0" data-index="0" aria-label="弹孔 1" type="button"></button>
            <button class="chamber" style="--i:1" data-index="1" aria-label="弹孔 2" type="button"></button>
            <button class="chamber" style="--i:2" data-index="2" aria-label="弹孔 3" type="button"></button>
            <button class="chamber" style="--i:3" data-index="3" aria-label="弹孔 4" type="button"></button>
            <button class="chamber" style="--i:4" data-index="4" aria-label="弹孔 5" type="button"></button>
            <button class="chamber" style="--i:5" data-index="5" aria-label="弹孔 6" type="button"></button>
          </div>
        </div>
      </div>
    </section>

    <div class="instruction">
      默认不会显示子弹位置，弹膛区域只能滑动旋转；点击“查看子弹”才会展示位置，点击“开枪”触发动作和音效。
    </div>
  </main>

  <script>
    (() => {
      const app = document.getElementById("app");
      const cylinder = document.getElementById("cylinder");
      const chambers = Array.from(document.querySelectorAll(".chamber"));
      const countText = document.getElementById("countText");
      const statusText = document.getElementById("statusText");
      const fireBtn = document.getElementById("fireBtn");
      const revealBtn = document.getElementById("revealBtn");
      const reloadBtn = document.getElementById("reloadBtn");
      const spinBtn = document.getElementById("spinBtn");
      const clearBtn = document.getElementById("clearBtn");
      const screenFlash = document.getElementById("screenFlash");
      const muzzleFlash = document.getElementById("muzzleFlash");
      const revolver = document.getElementById("revolver");

      const loaded = new Array(6).fill(false);

      let bulletsVisible = false;
      let rotation = 0;
      let isDragging = false;
      let pointerId = null;
      let lastAngle = 0;
      let downX = 0;
      let downY = 0;
      let totalMove = 0;
      let spinVelocity = 0;
      let rafId = null;
      let audioCtx = null;

      function ensureAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;

        if (!AudioContext) return null;

        if (!audioCtx) {
          audioCtx = new AudioContext();
        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        return audioCtx;
      }

      function playDryFireSound() {
        const ctx = ensureAudio();
        if (!ctx) return;

        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = "square";
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.045);

        filter.type = "highpass";
        filter.frequency.value = 500;

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.22, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      }

      function playGunShotSound() {
        const ctx = ensureAudio();
        if (!ctx) return;

        const now = ctx.currentTime;

        const duration = 0.42;
        const bufferSize = Math.floor(ctx.sampleRate * duration);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          const decay = Math.pow(1 - t, 4);
          data[i] = (Math.random() * 2 - 1) * decay;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = "lowpass";
        noiseFilter.frequency.setValueAtTime(2400, now);
        noiseFilter.frequency.exponentialRampToValueAtTime(360, now + duration);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.85, now + 0.012);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        const boom = ctx.createOscillator();
        const boomGain = ctx.createGain();

        boom.type = "triangle";
        boom.frequency.setValueAtTime(92, now);
        boom.frequency.exponentialRampToValueAtTime(38, now + 0.28);

        boomGain.gain.setValueAtTime(0.0001, now);
        boomGain.gain.exponentialRampToValueAtTime(0.55, now + 0.014);
        boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

        boom.connect(boomGain);
        boomGain.connect(ctx.destination);

        noise.start(now);
        noise.stop(now + duration);

        boom.start(now);
        boom.stop(now + 0.36);
      }

      function normalizeDeg(value) {
        return ((value % 360) + 360) % 360;
      }

      function activeChamberIndex() {
        /*
          每个弹孔原始角度为：i * 60deg - 90deg。
          枪管方向近似为右侧 0deg。
          所以需要满足：i * 60 - 90 + rotation ≈ 0。
          等价于：i * 60 + rotation ≈ 90。
        */
        const normalized = normalizeDeg(rotation);
        const rawIndex = Math.round((90 - normalized) / 60);
        return ((rawIndex % 6) + 6) % 6;
      }

      function setRotation(value) {
        rotation = value;
        cylinder.style.setProperty("--angle", `${rotation}deg`);
        updateActiveChamber();
      }

      function updateActiveChamber() {
        const activeIndex = activeChamberIndex();

        chambers.forEach((chamber, index) => {
          chamber.classList.toggle("active", index === activeIndex);
        });
      }

      function updateUI(message) {
        const count = loaded.filter(Boolean).length;

        chambers.forEach((chamber, index) => {
          chamber.classList.toggle("loaded", bulletsVisible && loaded[index]);
          chamber.setAttribute("aria-pressed", bulletsVisible && loaded[index] ? "true" : "false");
        });

        countText.textContent = `子弹 ${count} / 6`;

        if (message) {
          statusText.textContent = message;
        } else {
          statusText.textContent = bulletsVisible ? "位置已显示" : "位置隐藏";
        }

        revealBtn.textContent = bulletsVisible ? "隐藏子弹" : "查看子弹";

        updateActiveChamber();
      }

      function getCenter() {
        const rect = cylinder.getBoundingClientRect();

        return {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2
        };
      }

      function angleFromPointer(event) {
        const center = getCenter();
        const dx = event.clientX - center.x;
        const dy = event.clientY - center.y;

        return Math.atan2(dy, dx) * 180 / Math.PI;
      }

      function shortestDelta(current, previous) {
        return ((current - previous + 540) % 360) - 180;
      }

      function stopMomentum() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        spinVelocity = 0;
      }

      function runMomentum() {
        if (Math.abs(spinVelocity) < 0.05) {
          spinVelocity = 0;
          rafId = null;
          return;
        }

        setRotation(rotation + spinVelocity);
        spinVelocity *= 0.94;

        rafId = requestAnimationFrame(runMomentum);
      }

      function flashScreen() {
        screenFlash.classList.add("show");

        window.setTimeout(() => {
          screenFlash.classList.remove("show");
        }, 140);
      }

      function playClassAnimation(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);

        window.setTimeout(() => {
          element.classList.remove(className);
        }, 360);
      }

      function showMuzzleFlash() {
        muzzleFlash.classList.remove("show");
        void muzzleFlash.offsetWidth;
        muzzleFlash.classList.add("show");

        window.setTimeout(() => {
          muzzleFlash.classList.remove("show");
        }, 180);
      }

      function loadRandomBullet() {
        loaded.fill(false);
        const index = Math.floor(Math.random() * 6);
        loaded[index] = true;
        bulletsVisible = false;
        updateUI("已重新装弹");
      }

      function clearBullets() {
        loaded.fill(false);
        bulletsVisible = false;
        updateUI("已清空");
      }

      function fire() {
        stopMomentum();

        const activeIndex = activeChamberIndex();
        const hasBullet = loaded[activeIndex];

        if (hasBullet) {
          bulletsVisible = true;

          playGunShotSound();
          showMuzzleFlash();
          flashScreen();

          playClassAnimation(revolver, "recoil");
          playClassAnimation(app, "shake");

          updateUI(`击发！弹孔 ${activeIndex + 1}`);
        } else {
          playDryFireSound();
          playClassAnimation(revolver, "dry");

          updateUI(`空枪：弹孔 ${activeIndex + 1}`);

          /*
            模拟扣动扳机后弹膛进入下一格。
            这里旋转 60 度，使下一格靠近枪管。
          */
          animateRotation(rotation + 60, 220);
        }
      }

      function animateRotation(target, duration = 600) {
        stopMomentum();

        const start = rotation;
        const startTime = performance.now();

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function animate(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const eased = easeOutCubic(t);

          setRotation(start + (target - start) * eased);

          if (t < 1) {
            requestAnimationFrame(animate);
          }
        }

        requestAnimationFrame(animate);
      }

      cylinder.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        stopMomentum();

        pointerId = event.pointerId;
        isDragging = true;
        totalMove = 0;
        downX = event.clientX;
        downY = event.clientY;

        lastAngle = angleFromPointer(event);

        cylinder.setPointerCapture(pointerId);
        cylinder.classList.add("dragging");
      });

      cylinder.addEventListener("pointermove", (event) => {
        if (!isDragging || event.pointerId !== pointerId) return;

        event.preventDefault();

        const currentAngle = angleFromPointer(event);
        const delta = shortestDelta(currentAngle, lastAngle);

        setRotation(rotation + delta);

        spinVelocity = delta;
        lastAngle = currentAngle;

        const moveX = event.clientX - downX;
        const moveY = event.clientY - downY;
        totalMove = Math.max(totalMove, Math.hypot(moveX, moveY));
      });

      cylinder.addEventListener("pointerup", (event) => {
        if (!isDragging || event.pointerId !== pointerId) return;

        event.preventDefault();

        cylinder.releasePointerCapture(pointerId);
        cylinder.classList.remove("dragging");

        /*
          默认不允许点击弹孔显示或修改子弹。
          弹膛区域只负责滑动旋转。
        */
        if (totalMove >= 8) {
          runMomentum();
        }

        isDragging = false;
        pointerId = null;
      });

      cylinder.addEventListener("pointercancel", () => {
        isDragging = false;
        pointerId = null;
        cylinder.classList.remove("dragging");
      });

      fireBtn.addEventListener("click", fire);

      revealBtn.addEventListener("click", () => {
        bulletsVisible = !bulletsVisible;
        updateUI(bulletsVisible ? "位置已显示" : "位置隐藏");
      });

      reloadBtn.addEventListener("click", () => {
        loadRandomBullet();
      });

      spinBtn.addEventListener("click", () => {
        stopMomentum();

        const extraTurns = 720 + Math.random() * 1080;
        const direction = Math.random() > 0.5 ? 1 : -1;
        const target = rotation + extraTurns * direction;

        animateRotation(target, 900);
      });

      clearBtn.addEventListener("click", () => {
        clearBullets();
      });

      loadRandomBullet();
      setRotation(0);
    })();
  </script>
</body>

</html>
