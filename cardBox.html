    function renderDeckItem(deck) {
        const lib = getLibrary(deck.libraryId);
        const base = deck.baseDeckId ? getDeck(deck.baseDeckId) : null;

        return `
            <div class="item">
                <div class="item-title">
                    ${h(deck.name)}
                    <span class="badge ${deck.type === "base" ? "badge-primary" : "badge-success"}">
                        ${deck.type === "base" ? "基础" : "扩展"}
                    </span>
                    <span class="badge">${deck.cardIds.length} 张</span>
                </div>
                <div class="item-meta">${h(deck.description || "无说明")}</div>
                <div class="item-meta">牌库：${h(lib?.name || "未知")}${base ? ` · 适用：${h(base.name)}` : ""}</div>
                <div class="actions">
                    <button onclick="openDeckForm('${deck.type}', '${deck.id}')">编辑</button>
                    <button onclick="duplicateDeck('${deck.id}')">复制</button>
                    <button class="btn-danger" onclick="deleteDeck('${deck.id}')">删除</button>
                </div>
            </div>
        `;
    }

    function openDeckForm(type, deckId = null) {
        if (!data.libraries.length) {
            alert("请先创建牌库。");
            nav("libraries");
            return;
        }

        const deck = deckId ? getDeck(deckId) : null;
        app.editDeckId = deckId;
        app.deckType = deck?.type || type;
        app.deckLibraryId = deck?.libraryId || data.libraries[0].id;

        openModal(
            deck ? "编辑牌组" : "新建牌组",
            renderDeckFormBody(deck),
            `
                <button onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="saveDeck()">保存牌组</button>
            `
        );
    }

    function renderDeckFormBody(deck) {
        const type = app.deckType;
        const lib = getLibrary(app.deckLibraryId) || data.libraries[0];
        const cards = lib ? cardsByLibrary(lib.id) : [];
        const selected = deck?.cardIds || [];
        const baseDecks = data.decks.filter(d => d.type === "base" && d.libraryId === lib.id && d.id !== deck?.id);

        return `
            <div class="form-grid">
                <div class="form-row">
                    <div>
                        <label>牌组名称</label>
                        <input id="deckName" value="${h(deck?.name || "")}" placeholder="例如：经典狼人杀" />
                    </div>
                    <div>
                        <label>牌组类型</label>
                        <input value="${type === "base" ? "基础牌组" : "扩展牌组"}" disabled />
                    </div>
                </div>

                <div>
                    <label>说明</label>
                    <textarea id="deckDesc">${h(deck?.description || "")}</textarea>
                </div>

                <div>
                    <label>所属牌库</label>
                    <select id="deckLib" ${deck ? "disabled" : ""} onchange="changeDeckLibrary(this.value)">
                        ${data.libraries.map(l => `
                            <option value="${l.id}" ${l.id === lib.id ? "selected" : ""}>${h(l.name)}</option>
                        `).join("")}
                    </select>
                </div>

                ${type === "extension" ? `
                    <div>
                        <label>适用基础牌组，可选</label>
                        <select id="deckBase">
                            <option value="">不指定</option>
                            ${baseDecks.map(b => `
                                <option value="${b.id}" ${deck?.baseDeckId === b.id ? "selected" : ""}>${h(b.name)}</option>
                            `).join("")}
                        </select>
                    </div>
                ` : ""}

                <div>
                    <label>包含卡牌</label>
                    ${cards.length === 0 ? `
                        <div class="empty">该牌库暂无卡牌。</div>
                    ` : `
                        <div class="grid grid-2">
                            ${cards.map(card => `
                                <label class="item" style="margin:0;color:var(--text);cursor:pointer;">
                                    <input class="deck-card" type="checkbox" value="${card.id}" ${selected.includes(card.id) ? "checked" : ""} style="width:auto;margin-right:7px;" />
                                    ${h(cardIcon(card))} ${h(cardName(card))}
                                    ${cardFaction(card) ? `<span class="badge">${h(cardFaction(card))}</span>` : ""}
                                </label>
                            `).join("")}
                        </div>
                    `}
                </div>
            </div>
        `;
    }

    function changeDeckLibrary(libraryId) {
        app.deckLibraryId = libraryId;
        const deck = app.editDeckId ? getDeck(app.editDeckId) : null;
        app.modal.body = renderDeckFormBody(deck);
        render();
    }

    function saveDeck() {
        const name = $("deckName").value.trim();
        const description = $("deckDesc").value.trim();
        const libraryId = $("deckLib").value;
        const cardIds = Array.from(document.querySelectorAll(".deck-card:checked")).map(x => x.value);
        const type = app.deckType;
        const baseDeckId = type === "extension" ? ($("deckBase")?.value || null) : null;

        if (!name) {
            alert("请填写牌组名称。");
            return;
        }

        if (!cardIds.length) {
            alert("请至少选择一张卡牌。");
            return;
        }

        if (app.editDeckId) {
            const deck = getDeck(app.editDeckId);
            deck.name = name;
            deck.description = description;
            deck.cardIds = cardIds;
            deck.baseDeckId = baseDeckId;
            logAction("编辑牌组", { deckId: deck.id, name });
        } else {
            const deck = {
                id: uid("deck"),
                type,
                name,
                description,
                libraryId,
                baseDeckId,
                cardIds,
                presets: []
            };
            data.decks.push(deck);
            logAction("新建牌组", { deckId: deck.id, name });
        }

        saveData();
        closeModal();
    }

    function duplicateDeck(deckId) {
        const deck = getDeck(deckId);
        if (!deck) return;

        const copy = JSON.parse(JSON.stringify(deck));
        copy.id = uid("deck");
        copy.name = `${copy.name} 副本`;

        data.decks.push(copy);
        logAction("复制牌组", { from: deckId, to: copy.id });
        saveData();
        render();
    }

    function deleteDeck(deckId) {
        const deck = getDeck(deckId);
        if (!deck) return;

        if (!confirm(`确定删除牌组「${deck.name}」吗？`)) return;

        data.decks = data.decks.filter(d => d.id !== deckId);
        data.decks.forEach(d => {
            if (d.baseDeckId === deckId) d.baseDeckId = null;
        });

        logAction("删除牌组", { deckId, name: deck.name });
        saveData();
        render();
    }

    function startGameSetup() {
        app.gameStep = "setup";
        app.draft = null;
        nav("game");
    }

    function renderGame() {
        if (data.currentGame) return renderCurrentGame();

        if (app.gameStep === "config" && app.draft) {
            return renderGameConfig();
        }

        const baseDecks = data.decks.filter(d => d.type === "base");

        return `
            <section class="screen">
                <div class="panel">
                    <div class="panel-header">
                        <div>
                            <h1 class="title">新建游戏</h1>
                            <div class="desc">选择牌组和人数。下一步再设置每种卡牌数量。</div>
                        </div>
                    </div>

                    ${baseDecks.length === 0 ? `
                        <div class="empty">请先创建至少一个基础牌组。</div>
                        <div class="actions">
                            <button class="btn-primary" onclick="nav('decks')">去创建牌组</button>
                        </div>
                    ` : renderGameSetup(baseDecks)}
                </div>

                <div class="panel">
                    <h2 class="title">简约抽卡流程</h2>
                    <div class="compact-list" style="margin-top:10px;">
                        <div class="item">
                            <div class="item-title">1. 选牌组</div>
                            <div class="item-meta">基础牌组 + 可选扩展牌组。</div>
                        </div>
                        <div class="item">
                            <div class="item-title">2. 配数量</div>
                            <div class="item-meta">卡牌总数必须等于玩家人数。</div>
                        </div>
                        <div class="item">
                            <div class="item-title">3. 玩家抽卡</div>
                            <div class="item-meta">身份查看在弹窗内完成，避免主界面拥挤。</div>
                        </div>
                    </div>
                </div>
            </section>
        `;
    }

    function renderGameSetup(baseDecks) {
        const selected = baseDecks[0];
        const exts = data.decks.filter(d =>
            d.type === "extension" &&
            d.libraryId === selected.libraryId &&
            (!d.baseDeckId || d.baseDeckId === selected.id)
        );

        return `
            <div class="form-grid">
                <div>
                    <label>基础牌组</label>
                    <select id="gameBase" onchange="renderGameExtensions(this.value)">
                        ${baseDecks.map(deck => `
                            <option value="${deck.id}">${h(deck.name)}</option>
                        `).join("")}
                    </select>
                </div>

                <div id="gameExtBox">
                    ${renderExtensionChoices(selected.id)}
                </div>

                <div>
                    <label>玩家人数</label>
                    <input id="gameCount" type="number" min="1" max="99" value="10" />
                </div>

                <button class="btn-primary" onclick="prepareGameConfig()">下一步</button>
            </div>
        `;
    }

    function renderGameExtensions(baseDeckId) {
        const box = $("gameExtBox");
        if (box) box.innerHTML = renderExtensionChoices(baseDeckId);
    }

    function renderExtensionChoices(baseDeckId) {
        const base = getDeck(baseDeckId);
        const exts = data.decks.filter(d =>
            d.type === "extension" &&
            d.libraryId === base.libraryId &&
            (!d.baseDeckId || d.baseDeckId === base.id)
        );

        return `
            <label>扩展牌组</label>
            ${exts.length === 0 ? `
                <div class="empty">暂无可用扩展牌组。</div>
            ` : `
                <div class="grid grid-2">
                    ${exts.map(ext => `
                        <label class="item" style="margin:0;color:var(--text);cursor:pointer;">
                            <input type="checkbox" class="game-ext" value="${ext.id}" style="width:auto;margin-right:7px;" />
                            ${h(ext.name)}
                            <div class="item-meta">${h(ext.description || "")}</div>
                        </label>
                    `).join("")}
                </div>
            `}
        `;
    }

    function prepareGameConfig() {
        const baseDeckId = $("gameBase").value;
        const playerCount = parseInt($("gameCount").value, 10);
        const extensionDeckIds = Array.from(document.querySelectorAll(".game-ext:checked")).map(x => x.value);

        if (!playerCount || playerCount <= 0) {
            alert("请输入正确的玩家人数。");
            return;
        }

        const players = Array.from({ length: playerCount }).map((_, i) => ({
            id: uid("player"),
            seat: i + 1,
            alias: ""
        }));

        const availableCards = getAvailableCardsForDraft(baseDeckId, extensionDeckIds);
        const counts = {};
        availableCards.forEach(card => counts[card.id] = 0);

        const base = getDeck(baseDeckId);
        const preset = base.presets?.find(p => p.playerCount === playerCount);
        if (preset) {
            Object.keys(counts).forEach(cardId => counts[cardId] = preset.counts?.[cardId] || 0);
        }

        app.draft = {
            baseDeckId,
            extensionDeckIds,
            playerCount,
            players,
            counts
        };

        app.gameStep = "config";
        render();
    }

    function getAvailableCardsForDraft(baseDeckId, extensionDeckIds) {
        const decks = [
            getDeck(baseDeckId),
            ...extensionDeckIds.map(getDeck)
        ].filter(Boolean);

        const set = new Set();
        decks.forEach(deck => deck.cardIds.forEach(id => set.add(id)));

        return Array.from(set).map(getCard).filter(Boolean);
    }

    function renderGameConfig() {
        const draft = app.draft;
        const cards = getAvailableCardsForDraft(draft.baseDeckId, draft.extensionDeckIds);
        const total = Object.values(draft.counts).reduce((a, b) => a + Number(b || 0), 0);
        const valid = total === draft.playerCount;

        return `
            <section class="screen">
                <div class="panel">
                    <div class="panel-header">
                        <div>
                            <h1 class="title">配置卡牌</h1>
                            <div class="desc">总数必须等于玩家人数。</div>
                        </div>
                        <button onclick="app.gameStep='setup'; render()">上一步</button>
                    </div>

                    <div class="notice ${valid ? "success" : ""}">
                        当前卡牌总数：<strong>${total}</strong> / ${draft.playerCount}
                        ${valid ? "，可以开始。" : total < draft.playerCount ? `，还差 ${draft.playerCount - total} 张。` : `，多了 ${total - draft.playerCount} 张。`}
                    </div>

                    <div class="divider"></div>

                    <div class="list-scroll compact-list">
                        ${cards.map(card => `
                            <div class="item">
                                <div class="item-title">
                                    ${h(cardIcon(card))} ${h(cardName(card))}
                                    ${cardFaction(card) ? `<span class="badge">${h(cardFaction(card))}</span>` : ""}
                                </div>
                                <div class="item-meta">${h(cardDesc(card) || "")}</div>
                                <div class="actions">
                                    <button onclick="changeDraftCount('${card.id}', -1)">-</button>
                                    <button disabled>${draft.counts[card.id] || 0}</button>
                                    <button onclick="changeDraftCount('${card.id}', 1)">+</button>
                                </div>
                            </div>
                        `).join("")}
                    </div>

                    <div class="actions">
                        <button onclick="openPlayerAliasModal()">设置玩家代号</button>
                        <button class="btn-primary" ${valid ? "" : "disabled"} onclick="createGame()">生成抽卡池</button>
                    </div>
                </div>

                <div class="panel">
                    <h2 class="title">玩家</h2>
                    <div class="player-grid" style="margin-top:10px;">
                        ${draft.players.map(p => `
                            <div class="item" style="text-align:center;padding:10px;">
                                <div class="item-title" style="justify-content:center;margin:0;">${p.seat}号</div>
                                <div class="item-meta">${h(p.alias || "未设置")}</div>
                            </div>
                        `).join("")}
                    </div>
                </div>
            </section>
        `;
    }

    function changeDraftCount(cardId, delta) {
        app.draft.counts[cardId] = Math.max(0, Number(app.draft.counts[cardId] || 0) + delta);
        render();
    }

    function openPlayerAliasModal() {
        const draft = app.draft;
        openModal(
            "玩家代号",
            `
                <div class="form-grid">
                    ${draft.players.map((p, i) => `
                        <div class="form-row">
                            <div>
                                <label>座位</label>
                                <input value="${p.seat}号" disabled />
                            </div>
                            <div>
                                <label>代号 / 昵称</label>
                                <input id="alias_${i}" value="${h(p.alias)}" placeholder="可选" />
                            </div>
                        </div>
                    `).join("")}
                </div>
            `,
            `
                <button onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="savePlayerAliases()">保存</button>
            `
        );
    }

    function savePlayerAliases() {
        app.draft.players.forEach((p, i) => {
            p.alias = $(`alias_${i}`)?.value.trim() || "";
        });
        closeModal();
    }

    function shuffle(array) {
        const arr = [...array];

        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }

        return arr;
    }

    function createGame() {
        const draft = app.draft;
        const total = Object.values(draft.counts).reduce((a, b) => a + Number(b || 0), 0);

        if (total !== draft.playerCount) {
            alert("卡牌总数必须等于玩家人数。");
            return;
        }

        let pool = [];

        Object.entries(draft.counts).forEach(([cardId, count]) => {
            for (let i = 0; i < Number(count || 0); i++) {
                pool.push({
                    instanceId: uid("inst"),
                    cardId,
                    drawnBy: null
                });
            }
        });

        data.currentGame = {
            id: uid("game"),
            createdAt: new Date().toISOString(),
            baseDeckId: draft.baseDeckId,
            extensionDeckIds: draft.extensionDeckIds,
            playerCount: draft.playerCount,
            players: draft.players.map(p => ({
                ...p,
                drawnCardId: null,
                drawnAt: null,
                viewed: false
            })),
            counts: draft.counts,
            pool: shuffle(pool),
            status: "drawing"
        };

        app.draft = null;
        app.gameStep = "setup";

        logAction("新建游戏", { gameId: data.currentGame.id, playerCount: data.currentGame.playerCount });
        saveData();
        render();
    }

    function renderCurrentGame() {
        const game = data.currentGame;
        const drawn = game.players.filter(p => p.drawnCardId).length;
        const allDone = drawn === game.playerCount;

        return `
            <section class="screen">
                <div class="panel">
                    <div class="panel-header">
                        <div>
                            <h1 class="title">${allDone ? "抽卡完成" : "玩家抽卡"}</h1>
                            <div class="desc">请选择自己的座位号或代号。</div>
                        </div>
                        <button onclick="openHostPanel()">主持人</button>
                    </div>

                    <div class="notice ${allDone ? "success" : ""}">
                        已抽取：<strong>${drawn}</strong> / ${game.playerCount}
                        ${allDone ? "。主持人可以查看完整身份。" : "。"}
                    </div>

                    <div class="divider"></div>

                    <div class="player-grid">
                        ${game.players.map(player => `
                            <button class="player-btn" ${player.drawnCardId ? "disabled" : ""} onclick="openDrawModal('${player.id}')">
                                <strong>${h(playerLabel(player))}</strong>
                                <span>${player.drawnCardId ? "已抽取" : "未抽取"}</span>
                            </button>
                        `).join("")}
                    </div>

                    <div class="actions">
                        <button onclick="openHostPanel()">主持人面板</button>
                        <button onclick="exportCurrentGame()">导出本局</button>
                        <button class="btn-danger" onclick="endGame()">结束本局</button>
                    </div>
                </div>

                <div class="panel">
                    <h2 class="title">当前牌局</h2>
                    <div class="compact-list" style="margin-top:10px;">
                        <div class="item">
                            <div class="item-title">基础牌组</div>
                            <div class="item-meta">${h(getDeck(game.baseDeckId)?.name || "未知")}</div>
                        </div>
                        <div class="item">
                            <div class="item-title">扩展牌组</div>
                            <div class="item-meta">
                                ${game.extensionDeckIds.length ? game.extensionDeckIds.map(id => h(getDeck(id)?.name || "未知")).join("、") : "未使用"}
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        `;
    }

    function playerLabel(player) {
        return `${player.seat}号${player.alias ? " " + player.alias : ""}`;
    }

    function openDrawModal(playerId) {
        const game = data.currentGame;
        const player = game.players.find(p => p.id === playerId);
        if (!player || player.drawnCardId) return;

        app.selectedPlayerId = playerId;

        const remaining = game.pool.filter(x => !x.drawnBy);

        openModal(
            `${playerLabel(player)} 抽卡`,
            `
                <div class="notice">请确认是本人操作，然后选择一张卡牌。</div>
                <div class="divider"></div>
                <div class="draw-grid">
                    ${remaining.map(item => `
                        <button class="draw-card" onclick="pickCard('${item.instanceId}')">?</button>
                    `).join("")}
                </div>
            `
        );
    }

    function pickCard(instanceId) {
        const game = data.currentGame;
        const player = game.players.find(p => p.id === app.selectedPlayerId);
        const item = game.pool.find(x => x.instanceId === instanceId);

        if (!player || !item || item.drawnBy) return;

        item.drawnBy = player.id;
        player.drawnCardId = item.cardId;
        player.drawnAt = new Date().toISOString();

        logAction("玩家抽卡", { player: playerLabel(player), cardId: item.cardId });
        saveData();

        openIdentityModal(player.id);
    }

    function openIdentityModal(playerId) {
        const game = data.currentGame;
        const player = game.players.find(p => p.id === playerId);
        const card = getCard(player.drawnCardId);

        openModal(
            `${playerLabel(player)} 查看身份`,
            `
                <div class="identity-box" id="identityBox">
                    <div class="identity-mask">
                        <div style="font-size:44px;">🙈</div>
                        <div class="title" style="margin-top:8px;">身份已隐藏</div>
                        <div class="desc">按住下方按钮查看，松开后隐藏。</div>
                    </div>

                    <div class="identity-content">
                        <div class="muted">你的身份是</div>
                        <div class="identity-name">${h(cardIcon(card))} ${h(cardName(card))}</div>
                        ${cardFaction(card) ? `<div class="badge badge-primary">${h(cardFaction(card))}</div>` : ""}
                        <div style="margin-top:12px;line-height:1.6;">${h(cardDesc(card) || "无描述")}</div>
                        ${card?.values?.notes ? `<div class="item-meta" style="margin-top:8px;">备注：${h(card.values.notes)}</div>` : ""}
                    </div>
                </div>
            `,
            `
                <button
                    class="btn-warning"
                    onpointerdown="toggleIdentity(true)"
                    onpointerup="toggleIdentity(false)"
                    onpointercancel="toggleIdentity(false)"
                    onmouseleave="toggleIdentity(false)"
                >按住查看</button>
                <button class="btn-success" onclick="completeDraw('${player.id}')">已记住，完成</button>
            `
        );
    }

    function toggleIdentity(show) {
        const box = $("identityBox");
        if (box) box.classList.toggle("show", show);
    }

    function completeDraw(playerId) {
        const game = data.currentGame;
        const player = game.players.find(p => p.id === playerId);

        if (player) player.viewed = true;

        app.selectedPlayerId = null;
        saveData();
        closeModal();
    }

    function openHostPanel() {
        const game = data.currentGame;
        if (!game) {
            alert("当前没有进行中的游戏。");
            return;
        }

        app.hostMode = app.hostMode || "seat";

        openModal(
            "主持人面板",
            `
                <div class="notice danger">这里会显示全部玩家身份，请确认只有主持人可以看到屏幕。</div>
                <div class="actions">
                    <button class="${app.hostMode === "seat" ? "btn-primary" : ""}" onclick="setHostMode('seat')">按号码</button>
                    <button class="${app.hostMode === "faction" ? "btn-primary" : ""}" onclick="setHostMode('faction')">按阵营</button>
                    <button class="${app.hostMode === "role" ? "btn-primary" : ""}" onclick="setHostMode('role')">按角色</button>
                </div>
                <div class="divider"></div>
                <div id="hostContent">${renderHostContent(game)}</div>
            `,
            `
                <button onclick="exportCurrentGame()">导出本局</button>
                <button class="btn-primary" onclick="closeModal()">完成</button>
            `
        );
    }

    function setHostMode(mode) {
        app.hostMode = mode;
        openHostPanel();
    }

    function renderHostContent(game) {
        if (app.hostMode === "faction") return renderHostGrouped(game, "faction");
        if (app.hostMode === "role") return renderHostGrouped(game, "role");

        return `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>玩家</th>
                            <th>身份</th>
                            <th>阵营</th>
                            <th>说明</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${game.players.map(player => {
                            const card = getCard(player.drawnCardId);
                            return `
                                <tr>
                                    <td>${h(playerLabel(player))}</td>
                                    <td>${card ? `${h(cardIcon(card))} ${h(cardName(card))}` : "未抽取"}</td>
                                    <td>${h(cardFaction(card) || "-")}</td>
                                    <td>${h(cardDesc(card) || "-")}</td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            </div>
        `;
    }

    function renderHostGrouped(game, mode) {
        const groups = {};

        game.players.forEach(player => {
            const card = getCard(player.drawnCardId);
            const key = mode === "faction"
                ? (cardFaction(card) || "未分组")
                : (cardName(card) || "未抽取");

            if (!groups[key]) groups[key] = [];
            groups[key].push({ player, card });
        });

        return `
            <div class="compact-list">
                ${Object.entries(groups).map(([key, rows]) => `
                    <div class="item">
                        <div class="item-title">${h(key)} <span class="badge">${rows.length} 人</span></div>
                        <div class="item-meta">
                            ${rows.map(row => `
                                <div style="margin:5px 0;">
                                    ${h(playerLabel(row.player))}
                                    ${mode === "faction" && row.card ? `：${h(cardIcon(row.card))} ${h(cardName(row.card))}` : ""}
                                </div>
                            `).join("")}
                        </div>
                    </div>
                `).join("")}
            </div>
        `;
    }

    function endGame() {
        if (!data.currentGame) return;

        if (!confirm("确定结束当前游戏吗？抽卡结果会从当前局中清除。")) return;

        const gameId = data.currentGame.id;
        data.currentGame = null;

        logAction("结束游戏", { gameId });
        saveData();
        nav("home");
    }

    function openSettings() {
        openModal(
            "设置",
            `
                <div class="item">
                    <div class="switch-row">
                        <div>
                            <div class="item-title">操作记录</div>
                            <div class="item-meta">
                                默认关闭。开启后才会记录新增、编辑、抽卡、结束游戏等操作。
                            </div>
                        </div>
                        <label class="switch">
                            <input id="historySwitch" type="checkbox" ${data.settings.enableHistory ? "checked" : ""} onchange="toggleHistorySetting(this.checked)" />
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="grid grid-2">
                    <button onclick="openHistoryPanel()">查看操作记录</button>
                    <button onclick="openDataPanel()">导入 / 导出</button>
                    <button class="btn-warning" onclick="resetDefaultData()">恢复默认数据</button>
                    <button class="btn-danger" onclick="clearAllLocalData()">清空本地数据</button>
                </div>
            `,
            `<button class="btn-primary" onclick="closeModal()">完成</button>`
        );
    }

    function toggleHistorySetting(enabled) {
        data.settings.enableHistory = enabled === true;
        saveData();

        if (enabled) {
            logAction("开启操作记录", {});
        }
    }

    function openHistoryPanel() {
        openModal(
            "操作记录",
            `
                ${!data.settings.enableHistory ? `
                    <div class="notice">操作记录当前为关闭状态。开启后才会记录新操作。</div>
                    <div class="divider"></div>
                ` : ""}

                ${data.histories.length === 0 ? `
                    <div class="empty">暂无操作记录。</div>
                ` : `
                    <div class="compact-list">
                        ${data.histories.map(item => `
                            <div class="item">
                                <div class="item-title">${h(item.action)}</div>
                                <div class="item-meta">${h(new Date(item.at).toLocaleString())}</div>
                                <div class="item-meta">${h(JSON.stringify(item.detail || {}))}</div>
                            </div>
                        `).join("")}
                    </div>
                `}
            `,
            `
                <button class="btn-danger" onclick="clearHistories()">清空记录</button>
                <button class="btn-primary" onclick="openSettings()">返回设置</button>
            `
        );
    }

    function clearHistories() {
        if (!confirm("确定清空操作记录吗？")) return;
        data.histories = [];
        saveData();
        openHistoryPanel();
    }

    function openDataPanel() {
        openModal(
            "导入 / 导出",
            `
                <div class="grid">
                    <div class="item">
                        <div class="item-title">导出全部数据</div>
                        <div class="item-meta">包含牌库、卡牌、牌组、当前游戏和设置。</div>
                        <div class="actions">
                            <button class="btn-primary" onclick="exportAllData()">导出 JSON</button>
                        </div>
                    </div>

                    <div class="item">
                        <div class="item-title">导入数据</div>
                        <div class="item-meta">导入后会覆盖当前本地数据，请先备份。</div>
                        <div class="actions">
                            <input id="importFile" type="file" accept="application/json" />
                            <button class="btn-warning" onclick="importData()">导入 JSON</button>
                        </div>
                    </div>

                    <div class="item">
                        <div class="item-title">导出本局结果</div>
                        <div class="item-meta">仅导出当前游戏的玩家身份结果。</div>
                        <div class="actions">
                            <button onclick="exportCurrentGame()" ${data.currentGame ? "" : "disabled"}>导出本局</button>
                        </div>
                    </div>
                </div>
            `,
            `<button class="btn-primary" onclick="openSettings()">返回设置</button>`
        );
    }

    function downloadJson(filename, obj) {
        const blob = new Blob([JSON.stringify(obj, null, 2)], {
            type: "application/json;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 600);
    }

    function dateStamp() {
        const d = new Date();
        return [
            d.getFullYear(),
            String(d.getMonth() + 1).padStart(2, "0"),
            String(d.getDate()).padStart(2, "0")
        ].join("") + "-" + [
            String(d.getHours()).padStart(2, "0"),
            String(d.getMinutes()).padStart(2, "0")
        ].join("");
    }

    function exportAllData() {
        downloadJson(`card-box-backup-${dateStamp()}.json`, data);
    }

    function exportCurrentGame() {
        if (!data.currentGame) {
            alert("当前没有游戏。");
            return;
        }

        const game = data.currentGame;

        const result = {
            exportedAt: new Date().toISOString(),
            gameId: game.id,
            playerCount: game.playerCount,
            baseDeck: getDeck(game.baseDeckId)?.name || "",
            extensionDecks: game.extensionDeckIds.map(id => getDeck(id)?.name || ""),
            players: game.players.map(player => {
                const card = getCard(player.drawnCardId);
                return {
                    seat: player.seat,
                    alias: player.alias,
                    label: playerLabel(player),
                    cardName: cardName(card),
                    type: cardType(card),
                    faction: cardFaction(card),
                    description: cardDesc(card),
                    notes: card?.values?.notes || ""
                };
            })
        };

        downloadJson(`card-box-game-result-${dateStamp()}.json`, result);
    }

    function importData() {
        const file = $("importFile")?.files?.[0];

        if (!file) {
            alert("请选择 JSON 文件。");
            return;
        }

        if (!confirm("导入会覆盖当前本地数据，确定继续吗？")) return;

        const reader = new FileReader();

        reader.onload = () => {
            try {
                const imported = migrateData(JSON.parse(reader.result));

                if (!Array.isArray(imported.libraries) || !Array.isArray(imported.cards) || !Array.isArray(imported.decks)) {
                    alert("导入失败：文件格式不正确。");
                    return;
                }

                data = imported;
                saveData();
                alert("导入成功。");
                nav("home");
            } catch (e) {
                alert("导入失败：JSON 解析错误。");
            }
        };

        reader.readAsText(file);
    }

    function resetDefaultData() {
        if (!confirm("确定恢复默认数据吗？当前数据会被覆盖。")) return;

        data = createDefaultData();
        saveData();
        nav("home");
    }

    function clearAllLocalData() {
        if (!confirm("确定清空全部本地数据吗？此操作不可恢复。")) return;

        data = {
            version: 2,
            settings: { enableHistory: false },
            histories: [],
            libraries: [],
            cards: [],
            decks: [],
            currentGame: null
        };

        saveData();
        nav("home");
    }

    render();

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("./sw.js").catch(function (error) {
                console.warn("Service Worker 注册失败：", error);
            });
        });
    }
</script>
</body>
</html>
