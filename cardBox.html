<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Card Box</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#101827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CardBox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <style>
        :root {
            --bg: #0f172a;
            --panel: #162033;
            --panel-2: #1f2b43;
            --panel-3: #25324d;
            --text: #f8fafc;
            --muted: #aab6ca;
            --line: rgba(255, 255, 255, 0.1);
            --primary: #6d8dff;
            --success: #26c281;
            --danger: #ff6172;
            --warning: #ffd166;
            --shadow: 0 14px 38px rgba(0, 0, 0, 0.35);
            --radius: 18px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at 20% 0%, rgba(109, 141, 255, 0.22), transparent 30%),
                radial-gradient(circle at 100% 100%, rgba(255, 97, 114, 0.12), transparent 34%),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 10px 12px;
            color: var(--text);
            background: var(--panel-2);
            cursor: pointer;
            transition: 0.15s ease;
            min-height: 42px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #8f6dff);
            border-color: transparent;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #19a56c);
            border-color: transparent;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #f64c9b);
            border-color: transparent;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #ff9f43);
            color: #1e293b;
            border-color: transparent;
        }

        .btn-ghost {
            background: transparent;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.065);
            color: var(--text);
            padding: 11px 12px;
            outline: none;
        }

        select option {
            background: #182236;
            color: var(--text);
        }

        textarea {
            min-height: 86px;
            resize: vertical;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .app-shell {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 10px 12px 8px;
            backdrop-filter: blur(16px);
            background: rgba(15, 23, 42, 0.82);
            border-bottom: 1px solid var(--line);
        }

        .topbar-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            min-width: 0;
            cursor: pointer;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav {
            display: grid;
            grid-template-columns: repeat(5, auto);
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .nav button {
            min-height: 36px;
            padding: 7px 10px;
            font-size: 13px;
            white-space: nowrap;
        }

        .main {
            flex: 1;
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 12px;
            padding-bottom: calc(12px + var(--safe-bottom));
        }

        .screen {
            min-height: calc(100dvh - 82px - var(--safe-top));
            display: grid;
            gap: 12px;
            align-content: start;
        }

        .panel {
            background: rgba(22, 32, 51, 0.9);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .title {
            margin: 0;
            font-size: 20px;
            font-weight: 850;
        }

        .desc {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            gap: 10px;
        }

        .grid-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .item {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.045);
            border-radius: 15px;
            padding: 12px;
        }

        .item-title {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        .item-meta {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .actions button {
            min-height: 38px;
            padding: 8px 10px;
            font-size: 13px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 999px;
            color: var(--muted);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.07);
            font-size: 11px;
            line-height: 1.4;
            white-space: nowrap;
        }

        .badge-primary {
            color: #dce5ff;
            background: rgba(109, 141, 255, 0.18);
            border-color: rgba(109, 141, 255, 0.35);
        }

        .badge-success {
            color: #d7ffec;
            background: rgba(38, 194, 129, 0.15);
            border-color: rgba(38, 194, 129, 0.3);
        }

        .badge-danger {
            color: #ffe3e7;
            background: rgba(255, 97, 114, 0.15);
            border-color: rgba(255, 97, 114, 0.3);
        }

        .muted {
            color: var(--muted);
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 12px 0;
        }

        .empty {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.035);
            border-radius: 15px;
            padding: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .notice {
            border: 1px solid rgba(255, 209, 102, 0.3);
            background: rgba(255, 209, 102, 0.12);
            color: #ffe9af;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
        }

        .notice.success {
            border-color: rgba(38, 194, 129, 0.32);
            background: rgba(38, 194, 129, 0.13);
            color: #d8ffed;
        }

        .notice.danger {
            border-color: rgba(255, 97, 114, 0.32);
            background: rgba(255, 97, 114, 0.13);
            color: #ffe2e6;
        }

        .form-grid {
            display: grid;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr 0.7fr 1.4fr auto;
            gap: 8px;
            align-items: end;
            margin-bottom: 8px;
        }

        .list-scroll {
            max-height: calc(100dvh - 220px);
            overflow: auto;
            padding-right: 2px;
        }

        .compact-list {
            display: grid;
            gap: 8px;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .player-btn {
            min-height: 54px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            text-align: center;
        }

        .player-btn strong {
            font-size: 14px;
        }

        .player-btn span {
            font-size: 11px;
            color: var(--muted);
        }

        .draw-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .draw-card {
            aspect-ratio: 0.72 / 1;
            min-height: 90px;
            font-size: 30px;
            font-weight: 900;
            background:
                linear-gradient(145deg, rgba(109, 141, 255, 0.35), rgba(255, 255, 255, 0.04)),
                var(--panel-3);
        }

        .identity-box {
            min-height: 210px;
            display: grid;
            place-items: center;
            text-align: center;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            user-select: none;
        }

        .identity-content {
            display: none;
        }

        .identity-box.show .identity-content {
            display: block;
        }

        .identity-box.show .identity-mask {
            display: none;
        }

        .identity-name {
            font-size: 36px;
            font-weight: 950;
            margin: 8px 0;
        }

        .table-wrap {
            overflow: auto;
            max-height: calc(100dvh - 260px);
            border-radius: 14px;
            border: 1px solid var(--line);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px;
        }

        th,
        td {
            padding: 9px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
            font-size: 13px;
            vertical-align: top;
        }

        th {
            position: sticky;
            top: 0;
            background: #1b263b;
            color: var(--muted);
            font-weight: 700;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: end center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 12px;
            padding-top: calc(12px + var(--safe-top));
            padding-bottom: calc(12px + var(--safe-bottom));
        }

        .modal {
            width: min(760px, 100%);
            max-height: calc(100dvh - 24px - var(--safe-top) - var(--safe-bottom));
            display: flex;
            flex-direction: column;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: rgba(18, 27, 43, 0.98);
            box-shadow: var(--shadow);
        }

        .modal-head {
            padding: 13px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-title {
            font-weight: 850;
            font-size: 17px;
        }

        .modal-body {
            padding: 14px;
            overflow: auto;
        }

        .modal-foot {
            padding: 10px 14px;
            border-top: 1px solid var(--line);
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            background: rgba(255, 255, 255, 0.025);
        }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 28px;
            flex: 0 0 auto;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid var(--line);
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            left: 2px;
            top: 2px;
            background: #fff;
            border-radius: 50%;
            transition: 0.18s ease;
        }

        .switch input:checked + .slider {
            background: var(--primary);
        }

        .switch input:checked + .slider::before {
            transform: translateX(20px);
        }

        @media (orientation: landscape) and (max-height: 540px) {
            .topbar {
                padding: 7px 10px 5px;
            }

            .brand-title {
                font-size: 17px;
            }

            .brand-subtitle {
                display: none;
            }

            .nav button {
                min-height: 32px;
                padding: 5px 9px;
                font-size: 12px;
            }

            .main {
                padding: 8px 10px;
            }

            .screen {
                min-height: calc(100dvh - 58px - var(--safe-top));
                grid-template-columns: 0.95fr 1.05fr;
                align-items: start;
            }

            .panel {
                padding: 12px;
            }

            .list-scroll {
                max-height: calc(100dvh - 150px);
            }

            .player-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }

            .draw-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }

            .modal-backdrop {
                place-items: center;
            }

            .modal {
                max-height: calc(100dvh - 18px - var(--safe-top) - var(--safe-bottom));
            }
        }

        @media (max-width: 700px) {
            .topbar-main {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav {
                width: 100%;
                grid-template-columns: repeat(5, 1fr);
            }

            .nav button {
                width: 100%;
            }

            .grid-2,
            .grid-3,
            .form-row {
                grid-template-columns: 1fr;
            }

            .field-row {
                grid-template-columns: 1fr;
            }

            .player-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .draw-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 410px) {
            .player-grid,
            .draw-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .title {
                font-size: 18px;
            }

            .identity-name {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
<div class="app-shell">
    <header class="topbar">
        <div class="topbar-main">
            <div class="brand" onclick="nav('home')">
                <div class="brand-title">Card Box</div>
                <div class="brand-subtitle">PWA 子页面 · 竖屏 / 横屏优化版</div>
            </div>

            <nav class="nav">
                <button id="nav-home" onclick="nav('home')">首页</button>
                <button id="nav-game" onclick="nav('game')">游戏</button>
                <button id="nav-libs" onclick="nav('libraries')">牌库</button>
                <button id="nav-decks" onclick="nav('decks')">牌组</button>
                <button onclick="openSettings()">设置</button>
            </nav>
        </div>
    </header>

    <main id="app" class="main"></main>
</div>

<script>
    const STORAGE_KEY = "card_box_pwa_subpage_v2";

    const app = {
        view: "home",
        modal: null,
        editFields: null,
        editLibraryId: null,
        editCardId: null,
        editDeckId: null,
        deckType: "base",
        deckLibraryId: null,
        gameStep: "setup",
        draft: null,
        selectedPlayerId: null,
        hostMode: "seat"
    };

    let data = loadData();

    function uid(prefix = "id") {
        return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
    }

    function h(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function $(id) {
        return document.getElementById(id);
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadData() {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                return migrateData(parsed);
            } catch (e) {
                console.warn("数据解析失败，已恢复默认数据。", e);
            }
        }

        const initial = createDefaultData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
        return initial;
    }

    function migrateData(oldData) {
        oldData.version = 2;
        oldData.settings = oldData.settings || {};
        oldData.settings.enableHistory = oldData.settings.enableHistory === true;
        oldData.histories = Array.isArray(oldData.histories) ? oldData.histories : [];
        oldData.libraries = oldData.libraries || [];
        oldData.cards = oldData.cards || [];
        oldData.decks = oldData.decks || [];
        oldData.currentGame = oldData.currentGame || null;

        oldData.libraries.forEach(lib => {
            lib.fields = lib.fields || [];
            lib.fields.forEach(field => {
                field.id = field.id || uid("field");
                field.key = field.key || makeFieldKey(field.label || "field");
                field.type = field.type || "text";
                field.options = field.options || "";
                field.required = field.required === true;
            });
        });

        return oldData;
    }

    function createDefaultFields() {
        return [
            {
                id: uid("field"),
                key: "name",
                label: "名称",
                type: "text",
                required: true,
                options: ""
            },
            {
                id: uid("field"),
                key: "type",
                label: "类型",
                type: "select",
                required: false,
                options: "身份牌,道具牌,事件牌,任务牌"
            },
            {
                id: uid("field"),
                key: "faction",
                label: "阵营",
                type: "select",
                required: false,
                options: "好人阵营,狼人阵营,第三方,中立"
            },
            {
                id: uid("field"),
                key: "description",
                label: "描述",
                type: "textarea",
                required: false,
                options: ""
            },
            {
                id: uid("field"),
                key: "icon",
                label: "图标",
                type: "text",
                required: false,
                options: ""
            },
            {
                id: uid("field"),
                key: "notes",
                label: "备注",
                type: "textarea",
                required: false,
                options: ""
            }
        ];
    }

    function createDefaultData() {
        const libraryId = uid("lib");
        const fields = createDefaultFields();

        function card(values) {
            return {
                id: uid("card"),
                libraryId,
                values
            };
        }

        const cards = [
            card({
                name: "狼人",
                type: "身份牌",
                faction: "狼人阵营",
                description: "夜晚与其他狼人共同选择一名玩家出局。",
                icon: "🐺",
                notes: ""
            }),
            card({
                name: "平民",
                type: "身份牌",
                faction: "好人阵营",
                description: "没有特殊技能，通过发言和投票找出狼人。",
                icon: "👤",
                notes: ""
            }),
            card({
                name: "预言家",
                type: "身份牌",
                faction: "好人阵营",
                description: "每晚可以查验一名玩家的阵营。",
                icon: "👁️",
                notes: ""
            }),
            card({
                name: "女巫",
                type: "身份牌",
                faction: "好人阵营",
                description: "拥有解药和毒药，通常每瓶药只能使用一次。",
                icon: "🧪",
                notes: ""
            }),
            card({
                name: "猎人",
                type: "身份牌",
                faction: "好人阵营",
                description: "死亡时可以带走一名玩家，具体规则由主持人确认。",
                icon: "🏹",
                notes: ""
            }),
            card({
                name: "守卫",
                type: "身份牌",
                faction: "好人阵营",
                description: "每晚可以守护一名玩家。",
                icon: "🛡️",
                notes: ""
            }),
            card({
                name: "白狼王",
                type: "身份牌",
                faction: "狼人阵营",
                description: "白天自爆时可以带走一名玩家。",
                icon: "🐺",
                notes: "扩展角色。"
            }),
            card({
                name: "骑士",
                type: "身份牌",
                faction: "好人阵营",
                description: "白天可以发动决斗，验证一名玩家是否为狼人。",
                icon: "⚔️",
                notes: "扩展角色。"
            })
        ];

        const findId = name => cards.find(c => c.values.name === name).id;
        const baseDeckId = uid("deck");
        const extDeckId = uid("deck");

        return {
            version: 2,
            settings: {
                enableHistory: false
            },
            histories: [],
            libraries: [
                {
                    id: libraryId,
                    name: "狼人杀身份牌库",
                    description: "默认示例牌库。类型和阵营只是建议选项，新增卡牌时可以自由输入新值。",
                    fields
                }
            ],
            cards,
            decks: [
                {
                    id: baseDeckId,
                    type: "base",
                    name: "经典狼人杀",
                    description: "基础身份牌组。",
                    libraryId,
                    baseDeckId: null,
                    cardIds: [
                        findId("狼人"),
                        findId("平民"),
                        findId("预言家"),

    function nav(view) {
        app.view = view;
        app.modal = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function render() {
        const root = $("app");

        if (app.view === "home") root.innerHTML = renderHome();
        if (app.view === "game") root.innerHTML = renderGame();
        if (app.view === "libraries") root.innerHTML = renderLibraries();
        if (app.view === "decks") root.innerHTML = renderDecks();

        setActiveNav();

        if (app.modal) {
            root.insertAdjacentHTML("beforeend", renderModal(app.modal));
        }
    }

    function setActiveNav() {
        ["home", "game", "libs", "decks"].forEach(x => {
            const el = $("nav-" + x);
            if (el) el.classList.remove("btn-primary");
        });

        const map = {
            home: "home",
            game: "game",
            libraries: "libs",
            decks: "decks"
        };

        const active = $("nav-" + map[app.view]);
        if (active) active.classList.add("btn-primary");
    }

    function renderModal(modal) {
        return `
            <div class="modal-backdrop" onclick="backdropClose(event)">
                <section class="modal" role="dialog" aria-modal="true">
                    <div class="modal-head">
                        <div class="modal-title">${h(modal.title || "")}</div>
                        <button class="btn-ghost" onclick="closeModal()">关闭</button>
                    </div>
                    <div class="modal-body">
                        ${modal.body || ""}
                    </div>
                    ${modal.footer ? `<div class="modal-foot">${modal.footer}</div>` : ""}
                </section>
            </div>
        `;
    }

    function backdropClose(event) {
        if (event.target.classList.contains("modal-backdrop")) closeModal();
    }

    function closeModal() {
        app.modal = null;
        render();
    }

    function openModal(title, body, footer = "") {
        app.modal = { title, body, footer };
        render();
    }

    function getLibrary(id) {
        return data.libraries.find(x => x.id === id);
    }

    function getCard(id) {
        return data.cards.find(x => x.id === id);
    }

    function getDeck(id) {
        return data.decks.find(x => x.id === id);
    }

    function cardsByLibrary(libraryId) {
        return data.cards.filter(c => c.libraryId === libraryId);
    }

    function cardName(card) {
        return card?.values?.name || "未命名卡牌";
    }

    function cardType(card) {
        return card?.values?.type || "";
    }

    function cardFaction(card) {
        return card?.values?.faction || "";
    }

    function cardDesc(card) {
        return card?.values?.description || "";
    }

    function cardIcon(card) {
        return card?.values?.icon || "🃏";
    }

    function fieldTypeName(type) {
        return {
            text: "文本",
            textarea: "长文本",
            select: "建议选项",
            number: "数字",
            boolean: "是否"
        }[type] || type;
    }

    function optionArray(options) {
        return String(options || "")
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);
    }

    function makeFieldKey(label) {
        return "field_" + String(label || "custom")
            .toLowerCase()
            .replace(/[^\w\u4e00-\u9fa5]+/g, "_")
            .slice(0, 18) + "_" + Math.random().toString(36).slice(2, 5);
    }

    function logAction(action, detail = {}) {
        if (!data.settings?.enableHistory) return;

        data.histories.unshift({
            id: uid("his"),
            at: new Date().toISOString(),
            action,
            detail
        });

        data.histories = data.histories.slice(0, 300);
        saveData();
    }

    function renderLibraries() {
        return `
            <section class="screen">
                <div class="panel">
                    <div class="panel-header">
                        <div>
                            <h1 class="title">牌库</h1>
                            <div class="desc">字段结构可编辑；类型、阵营等建议选项可自由扩展。</div>

    function renderLibraryItem(lib) {
        const count = cardsByLibrary(lib.id).length;

        return `

                <div class="item-title">
                    ${h(lib.name)}
                    <span class="badge">${count} 张</span>
                </div>
                <div class="item-meta">${h(lib.description || "无说明")}</div>
                <div class="item-meta">字段：${lib.fields.map(f => h(f.label)).join("、")}</div>
                <div class="actions">
                    <button class="btn-primary" onclick="openLibraryDetail('${lib.id}')">查看</button>

    function openLibraryDetail(libraryId) {
        const lib = getLibrary(libraryId);
        if (!lib) return;

        const cards = cardsByLibrary(libraryId);

        openModal(
            lib.name,
            `
                <div class="item">
                    <div class="item-title">字段结构</div>
                    <div class="item-meta">
                        ${lib.fields.map(f => `
                            <span class="badge ${f.required ? "badge-primary" : ""}">
                                ${h(f.label)} · ${fieldTypeName(f.type)}${f.required ? " · 必填" : ""}
                            </span>
                        `).join(" ")}
                    </div>
                </div>

                <div class="divider"></div>

                ${cards.length === 0 ? `
                    <div class="empty">这个牌库还没有卡牌。</div>
                ` : `
                    <div class="compact-list">
                        ${cards.map(card => `
                            <div class="item">
                                <div class="item-title">
                                    ${h(cardIcon(card))} ${h(cardName(card))}
                                    ${cardType(card) ? `<span class="badge">${h(cardType(card))}</span>` : ""}
                                    ${cardFaction(card) ? `<span class="badge badge-primary">${h(cardFaction(card))}</span>` : ""}
                                </div>
                                <div class="item-meta">${h(cardDesc(card) || "无描述")}</div>
                                <div class="actions">
                                    <button onclick="openCardForm('${libraryId}', '${card.id}')">编辑</button>
                                    <button onclick="duplicateCard('${card.id}')">复制</button>
                                    <button class="btn-danger" onclick="deleteCard('${card.id}')">删除</button>
                                </div>
                            </div>
                        `).join("")}
                    </div>
                `}
            `,
            `
                <button onclick="openCardForm('${libraryId}')">新增卡牌</button>
                <button class="btn-primary" onclick="openLibraryForm('${libraryId}')">编辑字段</button>
            `
        );
    }

    function openLibraryForm(libraryId = null) {
        const lib = libraryId ? getLibrary(libraryId) : null;
        app.editLibraryId = libraryId;
        app.editFields = lib ? JSON.parse(JSON.stringify(lib.fields)) : createDefaultFields();

        openModal(
            lib ? "编辑牌库结构" : "新建牌库",
            renderLibraryFormBody(lib),
            `
                <button onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="saveLibraryForm()">保存</button>
            `
        );
    }

    function renderLibraryFormBody(lib) {
        return `
            <div class="form-grid">
                <div>
                    <label>牌库名称</label>
                    <input id="libName" value="${h(lib?.name || "新牌库")}" />
                </div>
                <div>
                    <label>说明</label>
                    <textarea id="libDesc">${h(lib?.description || "")}</textarea>
                </div>
            </div>

            <div class="divider"></div>

            <div class="notice">
                「建议选项」不是固定限制。新增卡牌时可以自由输入新类型、新阵营，保存后会自动进入建议列表。
            </div>

            <div class="divider"></div>

            <div id="fieldEditor">
                ${app.editFields.map((f, i) => `
                    <div class="field-row">
                        <div>
                            <label>字段名</label>
                            <input id="field_label_${i}" value="${h(f.label)}" />
                        </div>
                        <div>
                            <label>类型</label>
                            <select id="field_type_${i}">
                                ${["text", "textarea", "select", "number", "boolean"].map(t => `
                                    <option value="${t}" ${f.type === t ? "selected" : ""}>${fieldTypeName(t)}</option>
                                `).join("")}
                            </select>
                        </div>
                        <div>
                            <label>必填</label>
                            <select id="field_required_${i}">
                                <option value="true" ${f.required ? "selected" : ""}>是</option>
                                <option value="false" ${!f.required ? "selected" : ""}>否</option>
                            </select>
                        </div>
                        <div>
                            <label>建议选项，逗号分隔</label>
                            <input id="field_options_${i}" value="${h(f.options || "")}" placeholder="仅建议选项字段需要" />
                        </div>
                        <button class="btn-danger" onclick="removeEditField(${i})">删</button>
                    </div>
                `).join("")}
            </div>

            <div class="actions">
                <button onclick="addEditField()">添加字段</button>
            </div>
        `;
    }

    function collectEditFields() {
        if (!app.editFields) return;

        app.editFields = app.editFields.map((f, i) => ({
            ...f,
            label: $(`field_label_${i}`)?.value.trim() || f.label,
            type: $(`field_type_${i}`)?.value || f.type,
            required: $(`field_required_${i}`)?.value === "true",
            options: $(`field_options_${i}`)?.value.trim() || ""
        }));
    }

    function addEditField() {
        collectEditFields();

        app.editFields.push({
            id: uid("field"),
            key: makeFieldKey("自定义字段"),
            label: "自定义字段",
            type: "text",
            required: false,
            options: ""
        });

        const lib = app.editLibraryId ? getLibrary(app.editLibraryId) : null;
        app.modal.body = renderLibraryFormBody(lib);
        render();
    }

    function removeEditField(index) {
        collectEditFields();

        if (app.editFields.length <= 1) {
            alert("至少保留一个字段。");
            return;
        }

        app.editFields.splice(index, 1);

        const lib = app.editLibraryId ? getLibrary(app.editLibraryId) : null;
        app.modal.body = renderLibraryFormBody(lib);
        render();
    }

    function saveLibraryForm() {
        collectEditFields();

        const name = $("libName").value.trim();
        const description = $("libDesc").value.trim();

        if (!name) {
            alert("请填写牌库名称。");
            return;
        }

        if (!app.editFields.length) {
            alert("请至少添加一个字段。");
            return;
        }

        if (app.editLibraryId) {
            const lib = getLibrary(app.editLibraryId);
            lib.name = name;
            lib.description = description;
            lib.fields = app.editFields;
            logAction("编辑牌库", { libraryId: lib.id, name });
        } else {
            const lib = {
                id: uid("lib"),
                name,
                description,
                fields: app.editFields
            };
            data.libraries.push(lib);
            logAction("新建牌库", { libraryId: lib.id, name });
        }

        app.editFields = null;
        app.editLibraryId = null;
        saveData();
        closeModal();
    }

    function deleteLibrary(libraryId) {
        const lib = getLibrary(libraryId);
        if (!lib) return;

        const cardCount = data.cards.filter(c => c.libraryId === libraryId).length;
        const deckCount = data.decks.filter(d => d.libraryId === libraryId).length;

        if (!confirm(`确定删除「${lib.name}」吗？\n相关卡牌 ${cardCount} 张、牌组 ${deckCount} 个也会删除。`)) return;

        data.libraries = data.libraries.filter(x => x.id !== libraryId);
        data.cards = data.cards.filter(x => x.libraryId !== libraryId);
        data.decks = data.decks.filter(x => x.libraryId !== libraryId);

        logAction("删除牌库", { libraryId, name: lib.name });
        saveData();
        closeModal();
    }

    function openCardForm(libraryId, cardId = null) {
        const lib = getLibrary(libraryId);
        if (!lib) return;

        const card = cardId ? getCard(cardId) : null;
        app.editCardId = cardId;

        openModal(
            card ? "编辑卡牌" : "新增卡牌",
            `
                <div class="notice">
                    类型、阵营等「建议选项」可以直接输入新值，不再固定限制。
                </div>

                <div class="divider"></div>

                <div class="form-grid">
                    ${lib.fields.map(field => renderCardInput(field, card?.values?.[field.key])).join("")}
                </div>
            `,
            `
                <button onclick="openLibraryDetail('${libraryId}')">返回详情</button>
                <button class="btn-primary" onclick="saveCard('${libraryId}')">保存卡牌</button>
            `
        );
    }

    function renderCardInput(field, value) {
        const id = `card_${field.key}`;
        const v = value ?? "";

        if (field.type === "textarea") {
            return `
                <div>
                    <label>${h(field.label)}${field.required ? " *" : ""}</label>
                    <textarea id="${id}">${h(v)}</textarea>
                </div>
            `;
        }

        if (field.type === "select") {
            const datalistId = `list_${field.key}`;
            const options = optionArray(field.options);

            return `
                <div>
                    <label>${h(field.label)}${field.required ? " *" : ""}</label>
                    <input id="${id}" list="${datalistId}" value="${h(v)}" placeholder="可选择，也可直接输入新值" />
                    <datalist id="${datalistId}">
                        ${options.map(opt => `<option value="${h(opt)}"></option>`).join("")}
                    </datalist>
                </div>
            `;
        }

        if (field.type === "boolean") {
            return `
                <div>
                    <label>${h(field.label)}${field.required ? " *" : ""}</label>
                    <select id="${id}">
                        <option value="否" ${v === "否" ? "selected" : ""}>否</option>
                        <option value="是" ${v === "是" ? "selected" : ""}>是</option>
                    </select>
                </div>
            `;
        }

        if (field.type === "number") {
            return `
                <div>
                    <label>${h(field.label)}${field.required ? " *" : ""}</label>
                    <input id="${id}" type="number" value="${h(v)}" />
                </div>
            `;
        }

        return `
            <div>
                <label>${h(field.label)}${field.required ? " *" : ""}</label>
                <input id="${id}" value="${h(v)}" />
            </div>
        `;
    }

    function saveCard(libraryId) {
        const lib = getLibrary(libraryId);
        if (!lib) return;

        const values = {};

        for (const field of lib.fields) {
            const value = $(`card_${field.key}`)?.value.trim() || "";

            if (field.required && !value) {
                alert(`请填写必填字段：${field.label}`);
                return;
            }

            values[field.key] = value;

            if (field.type === "select" && value) {
                const options = optionArray(field.options);
                if (!options.includes(value)) {
                    options.push(value);
                    field.options = options.join(",");
                }
            }
        }

        if (app.editCardId) {
            const card = getCard(app.editCardId);
            card.values = values;
            logAction("编辑卡牌", { cardId: card.id, name: cardName(card) });
        } else {
            const card = {
                id: uid("card"),
                libraryId,
                values
            };
            data.cards.push(card);
            logAction("新增卡牌", { cardId: card.id, name: cardName(card) });
        }

        saveData();
        app.editCardId = null;
        openLibraryDetail(libraryId);
    }

    function duplicateCard(cardId) {
        const card = getCard(cardId);
        if (!card) return;

        const copy = JSON.parse(JSON.stringify(card));
        copy.id = uid("card");
        copy.values.name = `${copy.values.name || "未命名"} 副本`;

        data.cards.push(copy);
        logAction("复制卡牌", { from: cardId, to: copy.id });
        saveData();
        openLibraryDetail(card.libraryId);
    }

    function deleteCard(cardId) {
        const card = getCard(cardId);
        if (!card) return;

        if (!confirm(`确定删除卡牌「${cardName(card)}」吗？`)) return;

        data.cards = data.cards.filter(c => c.id !== cardId);
        data.decks.forEach(deck => {
            deck.cardIds = deck.cardIds.filter(id => id !== cardId);
            deck.presets?.forEach(p => delete p.counts[cardId]);
        });

        logAction("删除卡牌", { cardId, name: cardName(card) });
        saveData();
        openLibraryDetail(card.libraryId);
    }

    function renderDecks() {
        const baseDecks = data.decks.filter(d => d.type === "base");
        const extDecks = data.decks.filter(d => d.type === "extension");

        return `

                <div class="panel">
                    <div class="panel-header">
                        <div>

                        </div>
                    </div>

                    <div class="actions" style="margin-top:0;margin-bottom:10px;">
