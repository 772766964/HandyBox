<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Pick - 随机抽签工具</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --danger-dark: #b91c1c;
      --success: #16a34a;
      --warning: #f59e0b;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      background: #e5e7eb;
      color: #111827;
      transition: 0.15s ease;
    }

    button:hover {
      filter: brightness(0.96);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: var(--danger-dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .btn-light {
      background: #f3f4f6;
      color: #111827;
    }

    .btn-block {
      width: 100%;
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 247, 251, 0.92);
      backdrop-filter: blur(10px);
      padding: 12px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: 22px;
      margin: 0;
      line-height: 1.1;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .cards-grid {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title-wrap {
      min-width: 0;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      word-break: break-word;
    }

    .card-desc {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
      word-break: break-word;
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      flex: 0 0 auto;
      margin-top: 4px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
      padding: 5px 9px;
      font-size: 12px;
    }

    .tag-blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .tag-green {
      background: #dcfce7;
      color: #15803d;
    }

    .tag-yellow {
      background: #fef3c7;
      color: #b45309;
    }

    .tag-red {
      background: #fee2e2;
      color: #b91c1c;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.6);
    }

    .empty h2 {
      color: var(--text);
      margin-top: 0;
    }

    .form-card {
      max-width: 920px;
      margin: 0 auto;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .field label {
      font-weight: 700;
      font-size: 14px;
    }

    .field small {
      color: var(--muted);
      line-height: 1.4;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.5;
    }

    .section-title {
      margin: 18px 0 10px;
      font-size: 16px;
    }

    .draw-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 14px;
      align-items: start;
    }

    .big-result {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      border: 1px solid var(--border);
      padding: 24px;
      overflow: auto;
    }

    .result-name {
      font-size: clamp(36px, 8vw, 84px);
      font-weight: 900;
      color: var(--primary);
      word-break: break-word;
      line-height: 1.1;
      animation: pop 0.25s ease;
    }

    .result-list {
      width: 100%;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .winner-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      animation: pop 0.25s ease;
    }

    .group-result {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      width: 100%;
      text-align: left;
    }

    .group-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      animation: pop 0.25s ease;
    }

    .group-box h3 {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 16px;
    }

    .group-box p {
      margin: 0;
      line-height: 1.6;
      color: #374151;
    }

    .history-list {
      display: grid;
      gap: 12px;
    }

    .history-item {
      border: 1px solid var(--border);
      background: white;
      border-radius: 14px;
      padding: 14px;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .history-time {
      font-weight: 800;
    }

    .history-body {
      color: #374151;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 11px 15px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      bottom: 34px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 14px 0;
    }

    .help {
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 12px;
      line-height: 1.6;
      font-size: 14px;
    }

    .searchbar {
      margin-bottom: 14px;
    }

    .hidden {
      display: none !important;
    }

    @keyframes pop {
      from {
        transform: scale(0.96);
        opacity: 0.5;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 720px) {
      .app-shell {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions button {
        flex: 1 1 auto;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .draw-layout {
        grid-template-columns: 1fr;
      }

      .actions button {
        flex: 1 1 auto;
      }

      .brand h1 {
        font-size: 20px;
      }

      .big-result {
        min-height: 220px;
      }
    }

    @media (orientation: landscape) and (max-width: 900px) {
      .draw-layout {
        grid-template-columns: 300px 1fr;
      }

      .big-result {
        min-height: 220px;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <div id="app"></div>
  </div>

  <input id="importFile" type="file" accept="application/json,.json" class="hidden" />
  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "random_pick_static_web_v1";

    const MODE_LABELS = {
      one: "随机抽一个",
      multi: "随机抽多个",
      group: "随机分组"
    };

    const FILTER_LABELS = {
      none: "不过滤",
      round: "本轮过滤",
      permanent: "永久过滤"
    };

    const app = document.getElementById("app");
    const importFile = document.getElementById("importFile");

    let state = loadState();
    let currentView = { name: "home", id: null };
    let searchKeyword = "";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { cards: [] };
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.cards)) return { cards: [] };
        return parsed;
      } catch (error) {
        console.error(error);
        return { cards: [] };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function uid(prefix = "id") {
      if (window.crypto && crypto.randomUUID) {
        return prefix + "_" + crypto.randomUUID();
      }
      return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
    }

    function nowISO() {
      return new Date().toISOString();
    }

    function formatTime(iso) {
      if (!iso) return "从未";
      try {
        return new Date(iso).toLocaleString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch {
        return iso;
      }
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => {
        el.classList.remove("show");
      }, 1800);
    }

    function getCard(id) {
      return state.cards.find(card => card.id === id);
    }

    function createDefaultCard() {
      const t = nowISO();
      return {
        id: uid("card"),
        name: "",
        description: "",
        color: "#2563eb",
        mode: "one",
        participants: [],
        rules: {
          count: 1,
          filterMode: "none",
          groupBy: "groupCount",
          groupCount: 2,
          groupSize: 3
        },
        filteredIds: [],
        history: [],
        createdAt: t,
        updatedAt: t,
        lastUsedAt: null,
        lastResult: null
      };
    }

    function parseNames(text) {
      return String(text || "")
        .split(/[\n\r,，、;；|]+|\s{2,}/g)
        .map(item => item.trim())
        .filter(Boolean);
    }

    function uniqueNames(names) {
      const seen = new Set();
      const result = [];
      for (const name of names) {
        const key = name.trim();
        if (!key || seen.has(key)) continue;
        seen.add(key);
        result.push(key);
      }
      return result;
    }

    function buildParticipantsFromText(text, oldParticipants = []) {
      const names = uniqueNames(parseNames(text));
      const oldQueues = new Map();

      for (const p of oldParticipants) {
        if (!oldQueues.has(p.name)) oldQueues.set(p.name, []);
        oldQueues.get(p.name).push(p);
      }

      return names.map(name => {
        const queue = oldQueues.get(name);
        const old = queue && queue.length ? queue.shift() : null;
        return {
          id: old ? old.id : uid("person"),
          name,
          enabled: old ? old.enabled !== false : true,
          note: old ? old.note || "" : ""
        };
      });
    }

    function participantsText(card) {
      return card.participants.map(p => p.name).join("\n");
    }

    function enabledParticipants(card) {
      return card.participants.filter(p => p.enabled !== false);
    }

    function eligibleParticipants(card) {
      const enabled = enabledParticipants(card);
      const filterMode = card.rules?.filterMode || "none";
      if (filterMode === "none") return enabled;

      const filtered = new Set(card.filteredIds || []);
      return enabled.filter(p => !filtered.has(p.id));
    }

    function cleanFilteredIds(card) {
      const validIds = new Set(card.participants.map(p => p.id));
      card.filteredIds = (card.filteredIds || []).filter(id => validIds.has(id));
    }

    function randomInt(maxExclusive) {
      if (maxExclusive <= 0) return 0;

      if (window.crypto && crypto.getRandomValues) {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        return array[0] % maxExclusive;
      }

      return Math.floor(Math.random() * maxExclusive);
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function sample(array, count) {
      return shuffle(array).slice(0, count);
    }

    function addToFilter(card, participants) {
      const filterMode = card.rules?.filterMode || "none";
      if (filterMode === "none") return;

      const set = new Set(card.filteredIds || []);
      participants.forEach(p => set.add(p.id));
      card.filteredIds = [...set];
    }

    function resetFilter(card) {
      card.filteredIds = [];
      card.updatedAt = nowISO();
      saveState();
    }

    function ensureEnoughEligible(card, count) {
      cleanFilteredIds(card);

      const enabled = enabledParticipants(card);
      let eligible = eligibleParticipants(card);
      const filterMode = card.rules?.filterMode || "none";

      if (enabled.length === 0) {
        alert("当前卡片还没有可用名单，请先添加名单。");
        return null;
      }

      if (count > enabled.length) {
        alert(`抽取人数不能超过名单人数。\n当前可用名单：${enabled.length} 人，需要抽取：${count} 人。`);
        return null;
      }

      if (eligible.length >= count) return eligible;

      if (filterMode === "round") {
        const ok = confirm("本轮可抽人数不足，是否重置本轮过滤并开始新一轮？");
        if (!ok) return null;
        card.filteredIds = [];
        eligible = eligibleParticipants(card);
        saveState();
        return eligible.length >= count ? eligible : null;
      }

      if (filterMode === "permanent") {
        alert("永久过滤后可抽人数不足。请重置过滤、减少抽取人数或添加新名单。");
        return null;
      }

      alert("可抽人数不足。");
      return null;
    }

    function modeLabel(card) {
      return MODE_LABELS[card.mode] || "随机抽签";
    }

    function cardStats(card) {
      cleanFilteredIds(card);
      const total = card.participants.length;
      const enabled = enabledParticipants(card).length;
      const eligible = eligibleParticipants(card).length;
      const filtered = (card.filteredIds || []).length;
      return { total, enabled, eligible, filtered };
    }

    function render() {
      if (currentView.name === "home") renderHome();
      if (currentView.name === "edit") renderEdit(currentView.id);
      if (currentView.name === "draw") renderDraw(currentView.id);
      if (currentView.name === "history") renderHistory(currentView.id);
    }

    function renderTopbar(subtitle = "静态网页随机抽签工具") {
      return `
        <div class="topbar">
          <div class="brand" onclick="goHome()" role="button" title="返回首页">
            <div class="brand-icon">RP</div>
            <div>
              <h1>Random Pick</h1>
              <p>${escapeHTML(subtitle)}</p>
            </div>
          </div>
          <div class="top-actions">
            <button class="btn-primary" onclick="renderEdit(null)">+ 新建卡片</button>
            <button onclick="exportAll()">导出数据</button>
            <button onclick="importFile.click()">导入数据</button>
          </div>
        </div>
      `;
    }

    function renderHome() {
      const cards = state.cards
        .filter(card => {
          const key = searchKeyword.trim().toLowerCase();
          if (!key) return true;
          return `${card.name} ${card.description || ""}`.toLowerCase().includes(key);
        })
        .sort((a, b) => {
          const ta = a.lastUsedAt || a.updatedAt || a.createdAt || "";
          const tb = b.lastUsedAt || b.updatedAt || b.createdAt || "";
          return tb.localeCompare(ta);
        });

      const cardsHtml = cards.map(card => {
        const stats = cardStats(card);
        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title-wrap">
                <h2 class="card-title">${escapeHTML(card.name || "未命名卡片")}</h2>
                ${card.description ? `<div class="card-desc">${escapeHTML(card.description)}</div>` : ""}
              </div>
              <div class="color-dot" style="background:${escapeHTML(card.color || "#2563eb")}"></div>
            </div>

            <div class="meta">
              <span class="tag tag-blue">${escapeHTML(modeLabel(card))}</span>
              <span class="tag">名单 ${stats.enabled} 人</span>
              <span class="tag tag-green">可抽 ${stats.eligible} 人</span>
              <span class="tag tag-yellow">${escapeHTML(FILTER_LABELS[card.rules?.filterMode || "none"])}</span>
              <span class="tag">历史 ${card.history?.length || 0} 次</span>
            </div>

            <div class="card-desc">
              最近使用：${escapeHTML(formatTime(card.lastUsedAt))}
            </div>

            <div class="actions">
              <button class="btn-primary" onclick="renderDraw('${card.id}')">开始</button>
              <button onclick="renderEdit('${card.id}')">编辑</button>
              <button onclick="renderHistory('${card.id}')">历史</button>
              <button onclick="duplicateCard('${card.id}')">复制</button>
              <button class="btn-danger" onclick="deleteCard('${card.id}')">删除</button>
            </div>
          </div>
        `;
      }).join("");

      app.innerHTML = `
        ${renderTopbar()}
        <div class="searchbar">
          <input
            id="searchInput"
            type="search"
            placeholder="搜索卡片，例如：抽奖、点名、分组"
            value="${escapeHTML(searchKeyword)}"
            oninput="searchKeyword=this.value; renderHome();"
          />
        </div>

        ${state.cards.length === 0 ? `
          <div class="empty">
            <h2>还没有随机卡片</h2>
            <p>你可以创建一个“课堂点名”“年会抽奖”或“随机分组”卡片。</p>
            <button class="btn-primary" onclick="renderEdit(null)">创建第一张卡片</button>
          </div>
        ` : `
          <div class="grid cards-grid">
            ${cardsHtml || `
              <div class="empty">
                <h2>没有匹配结果</h2>
                <p>换个关键词试试。</p>
              </div>
            `}
          </div>
        `}
      `;
    }

    function renderEdit(id) {
      currentView = { name: "edit", id };

      const isNew = !id;
      const card = isNew ? createDefaultCard() : getCard(id);

      if (!card) {
        alert("卡片不存在。");
        goHome();
        return;
      }

      app.innerHTML = `
        ${renderTopbar(isNew ? "新建随机卡片" : "编辑随机卡片")}

        <div class="card form-card">
          <div class="card-header">
            <div>
              <h2 class="card-title">${isNew ? "新建卡片" : "编辑卡片"}</h2>
              <div class="card-desc">每张卡片对应一个独立的随机事件。</div>
            </div>
          </div>

          <div class="form-grid">
            <div class="field">
              <label>卡片名称 *</label>
              <input id="cardName" value="${escapeHTML(card.name)}" placeholder="例如：年会抽奖、课堂点名" />
            </div>

            <div class="field">
              <label>卡片颜色</label>
              <input id="cardColor" type="color" value="${escapeHTML(card.color || "#2563eb")}" />
            </div>
          </div>

          <div class="field">
            <label>描述</label>
            <input id="cardDescription" value="${escapeHTML(card.description || "")}" placeholder="可选，例如：年会随机抽奖" />
          </div>

          <div class="form-grid">
            <div class="field">
              <label>默认抽取模式</label>
              <select id="cardMode" onchange="updateRuleVisibility()">
                <option value="one" ${card.mode === "one" ? "selected" : ""}>随机抽一个</option>
                <option value="multi" ${card.mode === "multi" ? "selected" : ""}>随机抽多个</option>
                <option value="group" ${card.mode === "group" ? "selected" : ""}>随机分组</option>
              </select>
            </div>

            <div class="field">
              <label>抽中过滤</label>
              <select id="filterMode">
                <option value="none" ${card.rules?.filterMode === "none" ? "selected" : ""}>不过滤：每次都从完整名单抽</option>
                <option value="round" ${card.rules?.filterMode === "round" ? "selected" : ""}>本轮过滤：一轮抽完后可重置</option>
                <option value="permanent" ${card.rules?.filterMode === "permanent" ? "selected" : ""}>永久过滤：适合抽奖不重复中奖</option>
              </select>
            </div>
          </div>

          <div id="multiRule" class="field">
            <label>每次抽取人数</label>
            <input id="drawCount" type="number" min="1" value="${escapeHTML(card.rules?.count || 1)}" />
          </div>

          <div id="groupRule">
            <div class="form-grid">
              <div class="field">
                <label>分组方式</label>
                <select id="groupBy">
                  <option value="groupCount" ${card.rules?.groupBy !== "groupSize" ? "selected" : ""}>按组数分</option>
                  <option value="groupSize" ${card.rules?.groupBy === "groupSize" ? "selected" : ""}>按每组人数分</option>
                </select>
              </div>

              <div class="field">
                <label>组数</label>
                <input id="groupCount" type="number" min="1" value="${escapeHTML(card.rules?.groupCount || 2)}" />
              </div>

              <div class="field">
                <label>每组人数</label>
                <input id="groupSize" type="number" min="1" value="${escapeHTML(card.rules?.groupSize || 3)}" />
              </div>
            </div>
          </div>

          <div class="field">
            <label>名单输入 *</label>
            <textarea id="namesText" placeholder="支持换行、逗号、顿号、分号分隔。例如：
张三
李四
王五">${escapeHTML(participantsText(card))}</textarea>
            <small>保存时会自动去除空项和重复姓名。</small>
          </div>

          <div class="help">
            数据只保存在当前浏览器本地。建议重要名单定期使用“导出数据”备份。
          </div>

          <div class="actions">
            <button class="btn-primary" onclick="saveCardFromForm('${isNew ? "" : card.id}')">保存卡片</button>
            ${!isNew ? `<button onclick="exportCard('${card.id}')">导出此卡片</button>` : ""}
            <button onclick="goHome()">返回首页</button>
          </div>
        </div>
      `;

      updateRuleVisibility();
    }

    function updateRuleVisibility() {
      const mode = document.getElementById("cardMode")?.value || "one";
      const multiRule = document.getElementById("multiRule");
      const groupRule = document.getElementById("groupRule");

      if (multiRule) {
        multiRule.style.display = mode === "multi" ? "flex" : "none";
      }

      if (groupRule) {
        groupRule.style.display = mode === "group" ? "block" : "none";
      }
    }

    function saveCardFromForm(id) {
      const isNew = !id;
      let card = isNew ? createDefaultCard() : getCard(id);

      if (!card) {
        alert("卡片不存在。");
        return;
      }

      const name = document.getElementById("cardName").value.trim();
      const description = document.getElementById("cardDescription").value.trim();
      const color = document.getElementById("cardColor").value;
      const mode = document.getElementById("cardMode").value;
      const filterMode = document.getElementById("filterMode").value;
      const namesText = document.getElementById("namesText").value;
      const drawCount = Math.max(1, parseInt(document.getElementById("drawCount")?.value || "1", 10));
      const groupBy = document.getElementById("groupBy")?.value || "groupCount";
      const groupCount = Math.max(1, parseInt(document.getElementById("groupCount")?.value || "2", 10));
      const groupSize = Math.max(1, parseInt(document.getElementById("groupSize")?.value || "3", 10));

      if (!name) {
        alert("请输入卡片名称。");
        return;
      }

      const participants = buildParticipantsFromText(namesText, card.participants || []);

      if (participants.length === 0) {
        alert("请至少输入一个名单成员。");
        return;
      }

      card.name = name;
      card.description = description;
      card.color = color;
      card.mode = mode;
      card.participants = participants;
      card.rules = {
        count: drawCount,
        filterMode,
        groupBy,
        groupCount,
        groupSize
      };
      card.updatedAt = nowISO();

      cleanFilteredIds(card);

      if (isNew) {
        state.cards.push(card);
      }

      saveState();
      toast("卡片已保存");
      renderDraw(card.id);
    }

    function renderDraw(id) {
      currentView = { name: "draw", id };

      const card = getCard(id);
      if (!card) {
        alert("卡片不存在。");
        goHome();
        return;
      }

      const stats = cardStats(card);
      const lastResultHtml = renderLastResult(card);

      app.innerHTML = `
        ${renderTopbar(card.name || "开始抽取")}

        <div class="draw-layout">
          <div class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title">${escapeHTML(card.name || "未命名卡片")}</h2>
                ${card.description ? `<div class="card-desc">${escapeHTML(card.description)}</div>` : ""}
              </div>
              <div class="color-dot" style="background:${escapeHTML(card.color || "#2563eb")}"></div>
            </div>

            <div class="meta">
              <span class="tag tag-blue">${escapeHTML(modeLabel(card))}</span>
              <span class="tag">总名单 ${stats.total}</span>
              <span class="tag tag-green">可用 ${stats.enabled}</span>
              <span class="tag tag-yellow">可抽 ${stats.eligible}</span>
              <span class="tag tag-red">已过滤 ${stats.filtered}</span>
            </div>

            <div class="divider"></div>

            ${card.mode === "multi" ? `
              <div class="field">
                <label>本次抽取人数</label>
                <input id="runtimeCount" type="number" min="1" value="${escapeHTML(card.rules?.count || 1)}" />
              </div>
            ` : ""}

            ${card.mode === "group" ? `
              <div class="field">
                <label>分组方式</label>
                <select id="runtimeGroupBy">
                  <option value="groupCount" ${card.rules?.groupBy !== "groupSize" ? "selected" : ""}>按组数分</option>
                  <option value="groupSize" ${card.rules?.groupBy === "groupSize" ? "selected" : ""}>按每组人数分</option>
                </select>
              </div>

              <div class="form-grid" style="grid-template-columns:1fr 1fr;">
                <div class="field">
                  <label>组数</label>
                  <input id="runtimeGroupCount" type="number" min="1" value="${escapeHTML(card.rules?.groupCount || 2)}" />
                </div>
                <div class="field">
                  <label>每组人数</label>
                  <input id="runtimeGroupSize" type="number" min="1" value="${escapeHTML(card.rules?.groupSize || 3)}" />
                </div>
              </div>
            ` : ""}

            <div class="actions">
              <button class="btn-primary btn-block" onclick="startDraw('${card.id}')">
                ${card.mode === "group" ? "开始分组" : "开始抽取"}
              </button>
              <button onclick="renderEdit('${card.id}')">编辑卡片</button>
              <button onclick="renderHistory('${card.id}')">历史记录</button>
              <button onclick="handleResetFilter('${card.id}')">重置过滤</button>
              <button onclick="goHome()">返回首页</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title">结果</h2>
                <div class="card-desc">点击开始后会自动保存到历史记录。</div>
              </div>
            </div>

            <div id="resultBox" class="big-result">
              ${lastResultHtml || `<div class="card-desc">等待抽取...</div>`}
            </div>
          </div>
        </div>
      `;
    }

    function renderLastResult(card) {
      const result = card.lastResult;
      if (!result) return "";

      if (result.mode === "one") {
        return `<div class="result-name">${escapeHTML(result.result[0] || "")}</div>`;
      }

      if (result.mode === "multi") {
        return `
          <div class="result-list">
            ${(result.result || []).map((name, index) => `
              <div class="winner-item">${index + 1}. ${escapeHTML(name)}</div>
            `).join("")}
          </div>
        `;
      }

      if (result.mode === "group") {
        return `
          <div class="group-result">
            ${(result.result || []).map((group, index) => `
              <div class="group-box">
                <h3>第 ${index + 1} 组</h3>
                <p>${escapeHTML(group.join("、"))}</p>
              </div>
            `).join("")}
          </div>
        `;
      }

      return "";
    }

    function startDraw(id) {
      const card = getCard(id);
      if (!card) return;

      if (card.mode === "one") {
        drawPeople(card, 1);
      } else if (card.mode === "multi") {
        const count = Math.max(1, parseInt(document.getElementById("runtimeCount")?.value || card.rules.count || "1", 10));
        card.rules.count = count;
        drawPeople(card, count);
      } else if (card.mode === "group") {
        drawGroups(card);
      }
    }

    function drawPeople(card, count) {
      const eligible = ensureEnoughEligible(card, count);
      if (!eligible) return;

      const selected = sample(eligible, count);
      addToFilter(card, selected);

      const mode = count === 1 ? "one" : "multi";
      const names = selected.map(p => p.name);

      const record = {
        id: uid("history"),
        time: nowISO(),
        mode,
        participantCount: eligible.length,
        result: names,
        filterMode: card.rules.filterMode || "none"
      };

      card.history = card.history || [];
      card.history.unshift(record);
      card.lastResult = record;
      card.lastUsedAt = record.time;
      card.updatedAt = record.time;

      saveState();
      toast("抽取完成，已保存历史");
      renderDraw(card.id);
    }

    function drawGroups(card) {
      const groupByEl = document.getElementById("runtimeGroupBy");
      const groupCountEl = document.getElementById("runtimeGroupCount");
      const groupSizeEl = document.getElementById("runtimeGroupSize");

      const groupBy = groupByEl?.value || card.rules.groupBy || "groupCount";
      const groupCount = Math.max(1, parseInt(groupCountEl?.value || card.rules.groupCount || "2", 10));
      const groupSize = Math.max(1, parseInt(groupSizeEl?.value || card.rules.groupSize || "3", 10));

      card.rules.groupBy = groupBy;
      card.rules.groupCount = groupCount;
      card.rules.groupSize = groupSize;

      cleanFilteredIds(card);

      const enabled = enabledParticipants(card);
      let eligible = eligibleParticipants(card);

      if (enabled.length === 0) {
        alert("当前卡片还没有可用名单，请先添加名单。");
        return;
      }

      if (eligible.length === 0 && card.rules.filterMode === "round") {
        const ok = confirm("本轮所有人都已参与过，是否重置本轮过滤并重新分组？");
        if (!ok) return;
        card.filteredIds = [];
        eligible = eligibleParticipants(card);
      }

      if (eligible.length === 0) {
        alert("当前没有可参与分组的人，请重置过滤或添加名单。");
        return;
      }

      const shuffled = shuffle(eligible);
      let groups = [];

      if (groupBy === "groupCount") {
        const count = Math.min(groupCount, shuffled.length);
        groups = Array.from({ length: count }, () => []);
        shuffled.forEach((person, index) => {
          groups[index % count].push(person);
        });
      } else {
        for (let i = 0; i < shuffled.length; i += groupSize) {
          groups.push(shuffled.slice(i, i + groupSize));
        }
      }

      addToFilter(card, shuffled);

      const record = {
        id: uid("history"),
        time: nowISO(),
        mode: "group",
        participantCount: eligible.length,
        result: groups.map(group => group.map(p => p.name)),
        filterMode: card.rules.filterMode || "none"
      };

      card.history = card.history || [];
      card.history.unshift(record);
      card.lastResult = record;
      card.lastUsedAt = record.time;
      card.updatedAt = record.time;

      saveState();
      toast("分组完成，已保存历史");
      renderDraw(card.id);
    }

    function renderHistory(id) {
      currentView = { name: "history", id };

      const card = getCard(id);
      if (!card) {
        alert("卡片不存在。");
        goHome();
        return;
      }

      const history = card.history || [];

      app.innerHTML = `
        ${renderTopbar(`${card.name} - 历史记录`)}

        <div class="card">
          <div class="card-header">
            <div>
              <h2 class="card-title">${escapeHTML(card.name)} - 历史记录</h2>
              <div class="card-desc">共 ${history.length} 条记录。</div>
            </div>
          </div>

          <div class="actions">
            <button onclick="renderDraw('${card.id}')">返回抽取</button>
            <button onclick="exportCard('${card.id}')">导出此卡片</button>
            <button class="btn-danger" onclick="clearHistory('${card.id}')">清空历史</button>
          </div>

          <div class="divider"></div>

          ${history.length === 0 ? `
            <div class="empty">
              <h2>暂无历史记录</h2>
              <p>开始抽取后，结果会自动保存到这里。</p>
            </div>
          ` : `
            <div class="history-list">
              ${history.map(item => `
                <div class="history-item">
                  <div class="history-head">
                    <div>
                      <div class="history-time">${escapeHTML(formatTime(item.time))}</div>
                      <div class="meta">
                        <span class="tag tag-blue">${escapeHTML(MODE_LABELS[item.mode] || item.mode)}</span>
                        <span class="tag">参与 ${item.participantCount || 0} 人</span>
                        <span class="tag tag-yellow">${escapeHTML(FILTER_LABELS[item.filterMode || "none"])}</span>
                      </div>
                    </div>
                    <button class="btn-danger" onclick="deleteHistory('${card.id}', '${item.id}')">删除</button>
                  </div>

                  <div class="history-body">${escapeHTML(historyResultText(item))}</div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    function historyResultText(item) {
      if (item.mode === "one") {
        return `结果：${(item.result || []).join("、")}`;
      }

      if (item.mode === "multi") {
        return `抽中：\n${(item.result || []).map((name, index) => `${index + 1}. ${name}`).join("\n")}`;
      }

      if (item.mode === "group") {
        return (item.result || [])
          .map((group, index) => `第 ${index + 1} 组：${group.join("、")}`)
          .join("\n");
      }

      return JSON.stringify(item.result, null, 2);
    }

    function handleResetFilter(id) {
      const card = getCard(id);
      if (!card) return;

      const ok = confirm("确定要重置此卡片的抽中过滤状态吗？");
      if (!ok) return;

      resetFilter(card);
      toast("过滤状态已重置");
      renderDraw(id);
    }

    function deleteHistory(cardId, historyId) {
      const card = getCard(cardId);
      if (!card) return;

      const ok = confirm("确定删除这条历史记录吗？");
      if (!ok) return;

      card.history = (card.history || []).filter(item => item.id !== historyId);
      card.updatedAt = nowISO();
      saveState();
      toast("历史记录已删除");
      renderHistory(cardId);
    }

    function clearHistory(cardId) {
      const card = getCard(cardId);
      if (!card) return;

      const ok = confirm(`确定清空「${card.name}」的全部历史记录吗？`);
      if (!ok) return;

      card.history = [];
      card.lastResult = null;
      card.updatedAt = nowISO();
      saveState();
      toast("历史记录已清空");
      renderHistory(cardId);
    }

    function deleteCard(id) {
      const card = getCard(id);
      if (!card) return;

      const ok = confirm(`确定删除「${card.name}」吗？\n删除后名单、规则和历史记录都会被删除。`);
      if (!ok) return;

      state.cards = state.cards.filter(item => item.id !== id);
      saveState();
      toast("卡片已删除");
      goHome();
    }

    function duplicateCard(id) {
      const card = getCard(id);
      if (!card) return;

      const copy = JSON.parse(JSON.stringify(card));
      copy.id = uid("card");
      copy.name = `${card.name} 副本`;
      copy.filteredIds = [];
      copy.history = [];
      copy.lastResult = null;
      copy.lastUsedAt = null;
      copy.createdAt = nowISO();
      copy.updatedAt = nowISO();

      copy.participants = copy.participants.map(p => ({
        ...p,
        id: uid("person")
      }));

      state.cards.push(copy);
      saveState();
      toast("卡片已复制");
      renderHome();
    }

    function exportAll() {
      const data = {
        app: "Random Pick",
        version: 1,
        exportedAt: nowISO(),
        cards: state.cards
      };

      downloadJSON(data, `random-pick-backup-${Date.now()}.json`);
    }

    function exportCard(id) {
      const card = getCard(id);
      if (!card) return;

      const data = {
        app: "Random Pick",
        version: 1,
        exportedAt: nowISO(),
        card
      };

      downloadJSON(data, `random-pick-card-${safeFileName(card.name)}-${Date.now()}.json`);
    }

    function downloadJSON(data, filename) {
      const blob = new Blob([JSON.stringify(data, null, 2)], {
        type: "application/json;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("导出完成");
    }

    function safeFileName(name) {
      return String(name || "card").replace(/[\\/:*?"<>|]/g, "_").slice(0, 40);
    }

    importFile.addEventListener("change", async event => {
      const file = event.target.files?.[0];
      event.target.value = "";

      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);

        if (Array.isArray(data.cards)) {
          const ok = confirm("检测到完整备份数据。是否导入并覆盖当前所有数据？");
          if (!ok) return;

          state = {
            cards: normalizeCards(data.cards)
          };
          saveState();
          toast("数据导入完成");
          goHome();
          return;
        }

        if (data.card) {
          const imported = normalizeCard(data.card);
          imported.id = uid("card");
          imported.name = `${imported.name || "导入卡片"} 导入`;
          imported.createdAt = nowISO();
          imported.updatedAt = nowISO();

          imported.participants = imported.participants.map(p => ({
            ...p,
            id: uid("person")
          }));

          imported.filteredIds = [];
          state.cards.push(imported);
          saveState();
          toast("卡片导入完成");
          goHome();
          return;
        }

        alert("无法识别的 JSON 文件。");
      } catch (error) {
        console.error(error);
        alert("导入失败，请确认文件是有效的 JSON 数据。");
      }
    });

    function normalizeCards(cards) {
      return cards.map(normalizeCard).filter(Boolean);
    }

    function normalizeCard(card) {
      const fallback = createDefaultCard();
      const normalized = {
        ...fallback,
        ...card,
        id: card.id || uid("card"),
        name: card.name || "未命名卡片",
        description: card.description || "",
        color: card.color || "#2563eb",
        mode: ["one", "multi", "group"].includes(card.mode) ? card.mode : "one",
        participants: Array.isArray(card.participants) ? card.participants : [],
        rules: {
          ...fallback.rules,
          ...(card.rules || {})
        },
        filteredIds: Array.isArray(card.filteredIds) ? card.filteredIds : [],
        history: Array.isArray(card.history) ? card.history : [],
        createdAt: card.createdAt || nowISO(),
        updatedAt: card.updatedAt || nowISO(),
        lastUsedAt: card.lastUsedAt || null,
        lastResult: card.lastResult || null
      };

      normalized.participants = normalized.participants
        .filter(p => p && p.name)
        .map(p => ({
          id: p.id || uid("person"),
          name: String(p.name).trim(),
          enabled: p.enabled !== false,
          note: p.note || ""
        }));

      cleanFilteredIds(normalized);
      return normalized;
    }

    function goHome() {
      currentView = { name: "home", id: null };
      renderHome();
    }

    window.goHome = goHome;
    window.renderEdit = renderEdit;
    window.renderDraw = renderDraw;
    window.renderHistory = renderHistory;
    window.updateRuleVisibility = updateRuleVisibility;
    window.saveCardFromForm = saveCardFromForm;
    window.startDraw = startDraw;
    window.handleResetFilter = handleResetFilter;
    window.deleteHistory = deleteHistory;
    window.clearHistory = clearHistory;
    window.deleteCard = deleteCard;
    window.duplicateCard = duplicateCard;
    window.exportAll = exportAll;
    window.exportCard = exportCard;

    renderHome();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .then(function () {
            console.log("Service Worker 注册成功");
          })
          .catch(function (error) {
            console.warn("Service Worker 注册失败", error);
          });
      });
    }
  </script>
</body>
</html>
