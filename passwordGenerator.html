<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Password Generator / 密码生成器</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(17, 24, 39, .94);
            --panel2: rgba(31, 41, 55, .9);
            --text: #f9fafb;
            --muted: #9ca3af;
            --line: rgba(255, 255, 255, .11);
            --accent: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --input: rgba(255, 255, 255, .08);
            --radius: 18px;
            --shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", Arial, sans-serif;
            background:
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, .25), transparent 34%),
                radial-gradient(circle at 100% 100%, rgba(34, 197, 94, .17), transparent 34%),
                var(--bg);
        }

        body {
            padding:
                env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 12px;
            min-height: 40px;
            padding: 9px 12px;
            color: var(--text);
            background: var(--input);
            cursor: pointer;
            transition: transform .12s ease, filter .12s ease;
        }

        button:active {
            transform: scale(.97);
        }

        button.primary {
            background: linear-gradient(135deg, #0ea5e9, #22c55e);
            font-weight: 800;
        }

        button.good {
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, .35);
            background: rgba(34, 197, 94, .16);
        }

        button.danger {
            color: #fecaca;
            border: 1px solid rgba(239, 68, 68, .35);
            background: rgba(239, 68, 68, .16);
        }

        button.ghost {
            border: 1px solid var(--line);
            background: transparent;
        }

        input,
        textarea {
            width: 100%;
            min-height: 40px;
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            color: var(--text);
            background: var(--input);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        input:focus,
        textarea:focus {
            border-color: rgba(56, 189, 248, .65);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, .12);
        }

        input[type="range"] {
            padding: 0;
            min-height: auto;
            accent-color: var(--accent);
        }

        .app {
            height: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header {
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            min-width: 0;
            line-height: 1.08;
        }

        .brand b {
            display: block;
            font-size: 17px;
            white-space: nowrap;
        }

        .brand span {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .tabs {
            display: flex;
            gap: 5px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, .06);
        }

        .tab {
            min-height: 32px;
            padding: 6px 10px;
            border-radius: 10px;
            color: var(--muted);
            background: transparent;
            white-space: nowrap;
        }

        .tab.active {
            color: white;
            background: rgba(56, 189, 248, .18);
        }

        main {
            flex: 1;
            min-height: 0;
            display: grid;
        }

        .view {
            display: none;
            min-height: 0;
        }

        .view.active {
            display: grid;
            gap: 10px;
        }

        .card {
            min-height: 0;
            overflow: auto;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .generator {
            grid-template-rows: auto 1fr;
        }

        .output-card {
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .password-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 7px;
        }

        #passwordOutput {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: clamp(17px, 5vw, 28px);
            font-weight: 900;
            letter-spacing: .5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .strength {
            font-weight: 900;
        }

        .strength.weak {
            color: #fca5a5;
        }

        .strength.mid {
            color: #fcd34d;
        }

        .strength.strong {
            color: #86efac;
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .controls {
            display: grid;
            gap: 10px;
            align-content: start;
        }

        .label-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .checks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 9px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--input);
            font-size: 14px;
        }

        .check input {
            width: 18px;
            height: 18px;
            min-height: auto;
            accent-color: var(--accent);
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .manager {
            grid-template-rows: auto 1fr;
        }

        .vault-panel {
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .vault-status {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .vault-actions {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 7px;
        }

        .danger-zone {
            display: grid;
            gap: 7px;
            padding-top: 8px;
            margin-top: 4px;
            border-top: 1px solid var(--line);
        }

        .manager-list {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
            min-height: 0;
        }

        .search-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px;
        }

        .list {
            min-height: 0;
            overflow: auto;
            display: grid;
            align-content: start;
            gap: 8px;
        }

        .item {
            display: grid;
            gap: 8px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel2);
        }

        .item-title {
            font-weight: 900;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-sub {
            color: var(--muted);
            font-size: 12px;
            word-break: break-all;
        }

        .item-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .item-actions button {
            min-height: 35px;
            padding: 7px 8px;
            font-size: 13px;
        }

        .empty {
            padding: 26px 12px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 16px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: rgba(0, 0, 0, .62);
            z-index: 30;
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            width: min(560px, 100%);
            max-height: min(92vh, 720px);
            overflow: auto;
            display: grid;
            gap: 10px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #111827;
            box-shadow: var(--shadow);
        }

        .modal h2 {
            margin: 0;
            font-size: 18px;
        }

        .form-grid {
            display: grid;
            gap: 8px;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 60;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(15, 23, 42, .96);
            box-shadow: var(--shadow);
            font-size: 14px;
            transition: .2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (orientation: landscape),
        (min-width: 760px) {
            .view.active.generator {
                grid-template-columns: minmax(310px, .95fr) minmax(380px, 1.2fr);
                grid-template-rows: 1fr;
            }

            .view.active.manager {
                grid-template-columns: 330px 1fr;
                grid-template-rows: 1fr;
            }
        }

        @media (max-height: 620px) {
            .app {
                padding: 8px;
                gap: 7px;
            }

            header {
                min-height: 34px;
            }

            .brand span {
                display: none;
            }

            .card {
                padding: 10px;
                border-radius: 15px;
            }

            button,
            input {
                min-height: 36px;
                padding: 7px 9px;
            }

            .check {
                min-height: 34px;
                padding: 7px 8px;
            }

            textarea {
                min-height: 56px;
            }
        }

        @media (max-width: 360px) {
            .password-row {
                grid-template-columns: 1fr auto;
            }

            #saveGeneratedBtn {
                grid-column: span 2;
            }

            .vault-actions,
            .two {
                grid-template-columns: 1fr;
            }

            .item-actions {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="brand">
                <b>Password Generator</b>
                <span>本地加密密码生成 / 管理器</span>
            </div>

            <nav class="tabs">
                <button class="tab active" data-tab="generator">生成</button>
                <button class="tab" data-tab="manager">管理</button>
            </nav>
        </header>

        <main>
            <section id="generatorView" class="view generator active">
                <div class="card output-card">
                    <div class="password-row">
                        <input id="passwordOutput" readonly aria-label="生成的密码" />
                        <button id="copyPasswordBtn" class="good">复制</button>
                        <button id="regenBtn" class="primary">刷新</button>
                        <button id="saveGeneratedBtn" class="ghost">存入库</button>
                    </div>

                    <div class="mini">
                        <span>强度：<span id="strengthText" class="strength">-</span></span>
                        <span id="entropyText">-</span>
                    </div>

                    <div class="hint">
                        密码生成和密码库均在本机完成。密码库用主密码加密后保存在浏览器本地。
                    </div>
                </div>

                <div class="card controls">
                    <div>
                        <div class="label-line">
                            <span>长度</span>
                            <b><span id="lengthValue">20</span> 位</b>
                        </div>
                        <input id="lengthRange" type="range" min="6" max="64" value="20" />
                    </div>

                    <div class="checks">
                        <label class="check"><input id="useLower" type="checkbox" checked /> 小写</label>
                        <label class="check"><input id="useUpper" type="checkbox" checked /> 大写</label>
                        <label class="check"><input id="useNumber" type="checkbox" checked /> 数字</label>
                        <label class="check"><input id="useSymbol" type="checkbox" checked /> 符号</label>
                        <label class="check"><input id="avoidAmbiguous" type="checkbox" checked /> 排除易混淆</label>
                        <label class="check"><input id="mustEachType" type="checkbox" checked /> 每类至少一个</label>
                    </div>

                    <div>
                        <div class="label-line">
                            <span>自定义符号</span>
                            <span>留空用默认</span>
                        </div>
                        <input id="customSymbols" value="!@#$%^&*()-_=+[]{};:,.?/" />
                    </div>

                    <div class="two">
                        <button id="quick16Btn" class="ghost">16 位</button>
                        <button id="quick24Btn" class="ghost">24 位</button>
                    </div>
                </div>
            </section>

            <section id="managerView" class="view manager">
                <div class="card vault-panel">
                    <div>
                        <b>本地密码库</b>
                        <div id="vaultStatus" class="vault-status">未初始化</div>
                    </div>

                    <input id="masterPassword" type="password" autocomplete="current-password"
                        placeholder="主密码 / Master Password" />

                    <div class="vault-actions">
                        <button id="unlockBtn" class="primary">解锁</button>
                        <button id="createVaultBtn" class="good">创建库</button>
                        <button id="lockBtn" class="ghost">锁定</button>
                    </div>

                    <div class="hint">
                        首次使用请创建库。主密码不会保存，忘记后无法恢复。
                    </div>

                    <div class="danger-zone">
                        <button id="exportBtn" class="ghost">导出加密库</button>
                        <button id="importBtn" class="ghost">导入加密库</button>
                        <input id="importFile" type="file" accept="application/json,.json" hidden />
                        <button id="wipeBtn" class="danger">清空本地库</button>
                    </div>
                </div>

                <div class="card manager-list">
                    <div class="search-row">
                        <input id="searchInput" placeholder="搜索标题、账号、网址..." />
                        <button id="addItemBtn" class="primary">新增</button>
                    </div>

                    <div id="itemList" class="list">
                        <div class="empty">请先解锁或创建本地密码库</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="itemModal" class="modal-backdrop">
        <div class="modal">
            <h2 id="modalTitle">新增密码</h2>
            <input id="itemId" type="hidden" />

            <div class="form-grid">
                <input id="itemTitle" placeholder="标题，例如 Gmail" />
                <input id="itemUsername" placeholder="账号 / 用户名 / 邮箱" />

                <div class="password-row">
                    <input id="itemPassword" placeholder="密码" />
                    <button id="fillGeneratedBtn" class="ghost">填入生成</button>
                    <button id="copyItemPwdBtn" class="good">复制</button>
                </div>

                <input id="itemUrl" placeholder="网址，可选" />
                <textarea id="itemNotes" placeholder="备注，可选"></textarea>
            </div>

            <div class="modal-actions">
                <button id="cancelItemBtn" class="ghost">取消</button>
                <button id="saveItemBtn" class="primary">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        "use strict";

        const STORAGE_KEY = "local_password_generator_vault_v1";
        const ITERATIONS = 250000;

        const $ = id => document.getElementById(id);

        const state = {
            generatedPassword: "",
            unlocked: false,
            vaultKey: null,
            vaultMeta: null,
            vault: []
        };

        const els = {
            tabs: document.querySelectorAll(".tab"),
            generatorView: $("generatorView"),
            managerView: $("managerView"),

            passwordOutput: $("passwordOutput"),
            copyPasswordBtn: $("copyPasswordBtn"),
            regenBtn: $("regenBtn"),
            saveGeneratedBtn: $("saveGeneratedBtn"),
            strengthText: $("strengthText"),
            entropyText: $("entropyText"),
            lengthRange: $("lengthRange"),
            lengthValue: $("lengthValue"),
            useLower: $("useLower"),
            useUpper: $("useUpper"),
            useNumber: $("useNumber"),
            useSymbol: $("useSymbol"),
            avoidAmbiguous: $("avoidAmbiguous"),
            mustEachType: $("mustEachType"),
            customSymbols: $("customSymbols"),
            quick16Btn: $("quick16Btn"),
            quick24Btn: $("quick24Btn"),

            vaultStatus: $("vaultStatus"),
            masterPassword: $("masterPassword"),
            unlockBtn: $("unlockBtn"),
            createVaultBtn: $("createVaultBtn"),
            lockBtn: $("lockBtn"),
            exportBtn: $("exportBtn"),
            importBtn: $("importBtn"),
            importFile: $("importFile"),
            wipeBtn: $("wipeBtn"),
            searchInput: $("searchInput"),
            addItemBtn: $("addItemBtn"),
            itemList: $("itemList"),

            itemModal: $("itemModal"),
            modalTitle: $("modalTitle"),
            itemId: $("itemId"),
            itemTitle: $("itemTitle"),
            itemUsername: $("itemUsername"),
            itemPassword: $("itemPassword"),
            itemUrl: $("itemUrl"),
            itemNotes: $("itemNotes"),
            fillGeneratedBtn: $("fillGeneratedBtn"),
            copyItemPwdBtn: $("copyItemPwdBtn"),
            cancelItemBtn: $("cancelItemBtn"),
            saveItemBtn: $("saveItemBtn"),

            toast: $("toast")
        };

        function toast(msg) {
            els.toast.textContent = msg;
            els.toast.classList.add("show");
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => els.toast.classList.remove("show"), 1700);
        }

        function bytesToBase64(bytes) {
            let binary = "";
            bytes.forEach(b => binary += String.fromCharCode(b));
            return btoa(binary);
        }

        function base64ToBytes(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function randomBytes(len) {
            const arr = new Uint8Array(len);
            crypto.getRandomValues(arr);
            return arr;
        }

        function randomInt(maxExclusive) {
            const max = 0xffffffff;
            const limit = max - max % maxExclusive;
            const arr = new Uint32Array(1);

            do {
                crypto.getRandomValues(arr);
            } while (arr[0] >= limit);

            return arr[0] % maxExclusive;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = randomInt(i + 1);
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function uniqueChars(str) {
            return [...new Set([...str])].join("");
        }

        function getCharsets() {
            const ambiguous = new Set("Il1O0o|`'\"{}[]()/\\");
            const lower = "abcdefghijklmnopqrstuvwxyz";
            const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const nums = "0123456789";
            const defaultSymbols = "!@#$%^&*()-_=+[]{};:,.?/";
            const symbols = els.customSymbols.value.trim() || defaultSymbols;

            let groups = [];

            if (els.useLower.checked) groups.push({name: "lower", chars: lower});
            if (els.useUpper.checked) groups.push({name: "upper", chars: upper});
            if (els.useNumber.checked) groups.push({name: "number", chars: nums});
            if (els.useSymbol.checked) groups.push({name: "symbol", chars: symbols});

            groups = groups
                .map(g => {
                    let chars = uniqueChars(g.chars);
                    if (els.avoidAmbiguous.checked) {
                        chars = [...chars].filter(c => !ambiguous.has(c)).join("");
                    }
                    return {...g, chars};
                })
                .filter(g => g.chars.length > 0);

            return groups;
        }

        function updateStrength(entropy) {
            els.entropyText.textContent = entropy + " bits";
            els.strengthText.classList.remove("weak", "mid", "strong");

            if (entropy < 60) {
                els.strengthText.textContent = "一般";
                els.strengthText.classList.add("weak");
            } else if (entropy < 100) {
                els.strengthText.textContent = "较强";
                els.strengthText.classList.add("mid");
            } else {
                els.strengthText.textContent = "很强";
                els.strengthText.classList.add("strong");
            }
        }

        function generatePassword() {
            const len = Number(els.lengthRange.value);
            els.lengthValue.textContent = String(len);

            const groups = getCharsets();

            if (!groups.length) {
                els.passwordOutput.value = "";
                state.generatedPassword = "";
                updateStrength(0);
                toast("至少选择一种字符类型");
                return;
            }

            const pool = uniqueChars(groups.map(g => g.chars).join(""));
            const result = [];

            if (els.mustEachType.checked && groups.length <= len) {
                groups.forEach(g => result.push(g.chars[randomInt(g.chars.length)]));
            }

            while (result.length < len) {
                result.push(pool[randomInt(pool.length)]);
            }

            shuffle(result);

            state.generatedPassword = result.join("");
            els.passwordOutput.value = state.generatedPassword;

            const entropy = Math.round(len * Math.log2(pool.length));
            updateStrength(entropy);
        }

        async function copyText(text) {
            if (!text) {
                toast("没有可复制内容");
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            }

            toast("已复制");
        }

        async function deriveKey(password, saltBase64, iterations = ITERATIONS) {
            const enc = new TextEncoder();

            const baseKey = await crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );

            return crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: base64ToBytes(saltBase64),
                    iterations,
                    hash: "SHA-256"
                },
                baseKey,
                {name: "AES-GCM", length: 256},
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptJson(key, data) {
            const iv = randomBytes(12);
            const encoded = new TextEncoder().encode(JSON.stringify(data));

            const cipher = await crypto.subtle.encrypt(
                {name: "AES-GCM", iv},
                key,
                encoded
            );

            return {
                iv: bytesToBase64(iv),
                ct: bytesToBase64(new Uint8Array(cipher))
            };
        }

        async function decryptJson(key, box) {
            const plain = await crypto.subtle.decrypt(
                {name: "AES-GCM", iv: base64ToBytes(box.iv)},
                key,
                base64ToBytes(box.ct)
            );

            return JSON.parse(new TextDecoder().decode(plain));
        }

        function loadMeta() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;

            try {
                return JSON.parse(raw);
            } catch {
                return null;
            }
        }

        function saveMeta(meta) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(meta));
            state.vaultMeta = meta;
        }

        function formatTime(ts) {
            if (!ts) return "-";
            return new Date(ts).toLocaleString("zh-CN", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        async function createVault() {
            const password = els.masterPassword.value;

            if (password.length < 8) {
                toast("主密码至少 8 位");
                return;
            }

            if (loadMeta() && !confirm("本地已存在密码库，继续会覆盖旧库，确定吗？")) {
                return;
            }

            const salt = bytesToBase64(randomBytes(16));
            const key = await deriveKey(password, salt);

            const meta = {
                version: 1,
                kdf: "PBKDF2-SHA256",
                iterations: ITERATIONS,
                salt,
                verifier: await encryptJson(key, {ok: true}),
                vault: await encryptJson(key, []),
                updatedAt: Date.now()
            };

            saveMeta(meta);

            state.unlocked = true;
            state.vaultKey = key;
            state.vault = [];
            els.masterPassword.value = "";

            updateVaultUi();
            toast("密码库已创建");
        }

        async function unlockVault() {
            const meta = loadMeta();

            if (!meta) {
                toast("还没有密码库，请先创建");
                return;
            }

            const password = els.masterPassword.value;

            if (!password) {
                toast("请输入主密码");
                return;
            }

            try {
                const key = await deriveKey(password, meta.salt, meta.iterations || ITERATIONS);
                const verifier = await decryptJson(key, meta.verifier);

                if (!verifier || verifier.ok !== true) {
                    throw new Error("invalid verifier");
                }

                const vault = await decryptJson(key, meta.vault);

                state.unlocked = true;
                state.vaultKey = key;
                state.vaultMeta = meta;
                state.vault = Array.isArray(vault) ? vault : [];
                els.masterPassword.value = "";

                updateVaultUi();
                toast("已解锁");
            } catch {
                toast("主密码错误或密码库损坏");
            }
        }

        function lockVault() {
            state.unlocked = false;
            state.vaultKey = null;
            state.vault = [];
            state.vaultMeta = loadMeta();
            updateVaultUi();
            toast("已锁定");
        }

        async function persistVault() {
            if (!state.unlocked || !state.vaultKey || !state.vaultMeta) {
                toast("请先解锁密码库");
                return;
            }

            const meta = {
                ...state.vaultMeta,
                vault: await encryptJson(state.vaultKey, state.vault),
                updatedAt: Date.now()
            };

            saveMeta(meta);
            updateVaultUi();
        }

        function updateVaultUi() {
            const meta = loadMeta();

            if (state.unlocked) {
                els.vaultStatus.textContent =
                    `已解锁 · ${state.vault.length} 条 · 更新 ${formatTime(state.vaultMeta?.updatedAt)}`;
            } else if (meta) {
                els.vaultStatus.textContent =
                    `已锁定 · 本地存在加密库 · 更新 ${formatTime(meta.updatedAt)}`;
            } else {
                els.vaultStatus.textContent = "未初始化 · 当前没有本地密码库";
            }

            renderItems();
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function filteredItems() {
            const q = els.searchInput.value.trim().toLowerCase();

            const items = [...state.vault].sort((a, b) => {
                return (b.updatedAt || 0) - (a.updatedAt || 0);
            });

            if (!q) return items;

            return items.filter(item => {
                return [item.title, item.username, item.url, item.notes]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase()
                    .includes(q);
            });
        }

        function renderItems() {
            if (!state.unlocked) {
                els.itemList.innerHTML = `<div class="empty">请先解锁或创建本地密码库</div>`;
                return;
            }

            const items = filteredItems();

            if (!items.length) {
                els.itemList.innerHTML = `<div class="empty">暂无条目，点击“新增”保存密码</div>`;
                return;
            }

            els.itemList.innerHTML = items.map(item => `
        <article class="item" data-id="${escapeHtml(item.id)}">
          <div>
            <div class="item-title">${escapeHtml(item.title || "未命名")}</div>
            <div class="item-sub">${escapeHtml(item.username || "无账号")}</div>
            ${item.url ? `<div class="item-sub">${escapeHtml(item.url)}</div>` : ""}
          </div>
          <div class="item-actions">
            <button data-action="copyUser">账号</button>
            <button data-action="copyPass" class="good">密码</button>
            <button data-action="edit">编辑</button>
            <button data-action="delete" class="danger">删除</button>
          </div>
        </article>
      `).join("");
        }

        function newId() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
        }

        function openItemModal(item = null, presetPassword = "") {
            if (!state.unlocked) {
                toast("请先解锁密码库");
                return;
            }

            els.modalTitle.textContent = item?.id ? "编辑密码" : "新增密码";
            els.itemId.value = item?.id || "";
            els.itemTitle.value = item?.title || "";
            els.itemUsername.value = item?.username || "";
            els.itemPassword.value = item?.password || presetPassword || "";
            els.itemUrl.value = item?.url || "";
            els.itemNotes.value = item?.notes || "";

            els.itemModal.classList.add("show");
            setTimeout(() => els.itemTitle.focus(), 50);
        }

        function closeItemModal() {
            els.itemModal.classList.remove("show");
        }

        async function saveItem() {
            if (!state.unlocked) {
                toast("请先解锁密码库");
                return;
            }

            const title = els.itemTitle.value.trim();
            const username = els.itemUsername.value.trim();
            const password = els.itemPassword.value;

            if (!title) {
                toast("请输入标题");
                return;
            }

            if (!password) {
                toast("请输入密码");
                return;
            }

            const now = Date.now();
            const id = els.itemId.value || newId();
            const old = state.vault.find(x => x.id === id);

            const item = {
                id,
                title,
                username,
                password,
                url: els.itemUrl.value.trim(),
                notes: els.itemNotes.value.trim(),
                createdAt: old?.createdAt || now,
                updatedAt: now
            };

            const index = state.vault.findIndex(x => x.id === id);

            if (index >= 0) state.vault[index] = item;
            else state.vault.push(item);

            await persistVault();
            closeItemModal();
            toast("已保存");
        }

        async function deleteItem(id) {
            const item = state.vault.find(x => x.id === id);
            if (!item) return;

            if (!confirm(`确定删除「${item.title || "未命名"}」吗？`)) return;

            state.vault = state.vault.filter(x => x.id !== id);
            await persistVault();
            toast("已删除");
        }

        function switchTab(tab) {
            els.tabs.forEach(btn => {
                btn.classList.toggle("active", btn.dataset.tab === tab);
            });

            els.generatorView.classList.toggle("active", tab === "generator");
            els.managerView.classList.toggle("active", tab === "manager");
        }

        function exportVault() {
            const raw = localStorage.getItem(STORAGE_KEY);

            if (!raw) {
                toast("没有可导出的密码库");
                return;
            }

            const blob = new Blob([raw], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");

            a.href = url;
            a.download = "encrypted-password-vault.json";
            a.click();

            URL.revokeObjectURL(url);
            toast("已导出加密库");
        }

        function importVault(file) {
            if (!file) return;

            const reader = new FileReader();

            reader.onload = () => {
                try {
                    const json = JSON.parse(String(reader.result));

                    if (!json || !json.salt || !json.verifier || !json.vault) {
                        throw new Error("invalid vault");
                    }

                    if (!confirm("导入会覆盖当前本地密码库，确定继续吗？")) return;

                    localStorage.setItem(STORAGE_KEY, JSON.stringify(json));
                    lockVault();
                    toast("已导入，请用对应主密码解锁");
                } catch {
                    toast("导入失败：文件格式不正确");
                }
            };

            reader.readAsText(file);
        }

        function wipeVault() {
            if (!confirm("确定清空本地密码库吗？此操作不可恢复。")) return;

            localStorage.removeItem(STORAGE_KEY);
            state.unlocked = false;
            state.vaultKey = null;
            state.vaultMeta = null;
            state.vault = [];

            updateVaultUi();
            toast("本地库已清空");
        }

        function bindEvents() {
            els.tabs.forEach(btn => {
                btn.addEventListener("click", () => switchTab(btn.dataset.tab));
            });

            [
                els.lengthRange,
                els.useLower,
                els.useUpper,
                els.useNumber,
                els.useSymbol,
                els.avoidAmbiguous,
                els.mustEachType,
                els.customSymbols
            ].forEach(el => el.addEventListener("input", generatePassword));

            els.regenBtn.addEventListener("click", generatePassword);
            els.copyPasswordBtn.addEventListener("click", () => copyText(state.generatedPassword));

            els.quick16Btn.addEventListener("click", () => {
                els.lengthRange.value = "16";
                generatePassword();
            });

            els.quick24Btn.addEventListener("click", () => {
                els.lengthRange.value = "24";
                generatePassword();
            });

            els.saveGeneratedBtn.addEventListener("click", () => {
                switchTab("manager");
                openItemModal(null, state.generatedPassword);
            });

            els.createVaultBtn.addEventListener("click", createVault);
            els.unlockBtn.addEventListener("click", unlockVault);
            els.lockBtn.addEventListener("click", lockVault);

            els.masterPassword.addEventListener("keydown", e => {
                if (e.key === "Enter") unlockVault();
            });

            els.addItemBtn.addEventListener("click", () => openItemModal());
            els.searchInput.addEventListener("input", renderItems);

            els.itemList.addEventListener("click", e => {
                const btn = e.target.closest("button");
                const article = e.target.closest(".item");

                if (!btn || !article) return;

                const item = state.vault.find(x => x.id === article.dataset.id);
                if (!item) return;

                const action = btn.dataset.action;

                if (action === "copyUser") copyText(item.username);
                if (action === "copyPass") copyText(item.password);
                if (action === "edit") openItemModal(item);
                if (action === "delete") deleteItem(item.id);
            });

            els.fillGeneratedBtn.addEventListener("click", () => {
                els.itemPassword.value = state.generatedPassword;
                toast("已填入当前生成密码");
            });

            els.copyItemPwdBtn.addEventListener("click", () => copyText(els.itemPassword.value));
            els.cancelItemBtn.addEventListener("click", closeItemModal);
            els.saveItemBtn.addEventListener("click", saveItem);

            els.itemModal.addEventListener("click", e => {
                if (e.target === els.itemModal) closeItemModal();
            });

            window.addEventListener("keydown", e => {
                if (e.key === "Escape") closeItemModal();
            });

            els.exportBtn.addEventListener("click", exportVault);
            els.importBtn.addEventListener("click", () => els.importFile.click());

            els.importFile.addEventListener("change", () => {
                importVault(els.importFile.files[0]);
                els.importFile.value = "";
            });

            els.wipeBtn.addEventListener("click", wipeVault);
        }

        function init() {
            if (!window.crypto || !crypto.subtle || !crypto.getRandomValues) {
                alert("当前浏览器不完整支持 Web Crypto，密码生成或加密密码库可能无法使用。");
                return;
            }

            bindEvents();
            generatePassword();
            state.vaultMeta = loadMeta();
            updateVaultUi();
        }

        init();
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js")
                    .then(function () {
                        console.log("Service Worker 注册成功");
                    })
                    .catch(function (error) {
                        console.warn("Service Worker 注册失败", error);
                    });
            });
        }
    </script>
</body>
</html>
